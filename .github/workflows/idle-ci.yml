# 키우기의 타입 검사와 테스트(생성 파일 검사, import 경계 검사, 서버·클라이언트 번들 포함)를 돌린다. 키우기가 툴의 출력을 생성 파일로
# 커밋하므로 tools/가 바뀌어도 돈다. paths는 scripts/check.mjs의 영역 규칙과 같게 유지한다. 실행 시간과 LFS 사용량은 MANUAL.md의 "CI"에 있다.
name: idle CI

on:
  push:
    branches: [main]
    paths:
      - "idle/**"
      - "tools/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/idle-ci.yml"
      # 어떤 테스트도 문서를 읽지 않는다. 제외는 맨 뒤에 둬야 앞의 포함을 덮는다.
      - "!**/*.md"
  pull_request:
    paths:
      - "idle/**"
      - "tools/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/idle-ci.yml"
      - "!**/*.md"
  workflow_dispatch:

# 같은 PR(또는 브랜치)에 새 커밋이 오면 이전 실행을 취소해 무료 시간을 아낀다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    # 멈춘 테스트가 기본 한도(360분)까지 무료 시간을 쓰지 않게 한다.
    timeout-minutes: 10
    steps:
      # lfs가 꺼져 있으면 LFS 파일은 포인터로만 받는다.
      - uses: actions/checkout@v7
      # 테스트가 읽는 LFS 파일은 generate --check의 xlsx뿐이다. Unity 에셋 등 나머지는 받지 않는다.
      # LFS 필터가 설정되지 않은 저장소에서는 pull이 받기만 하고 파일을 바꾸지 않으므로 먼저 설치한다.
      - run: |
          git lfs install --local
          git lfs pull --include="idle/data/*.xlsx"
      # node:sqlite를 쓰므로 로컬과 같은 버전으로 고정한다.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck:idle
      - run: npm run test:idle
