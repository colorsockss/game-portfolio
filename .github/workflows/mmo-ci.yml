# MMORPG의 공용(패킷, 기획 데이터)과 서버를 검사한다: 생성 파일 검사(packets.proto와 mmo/data/의 xlsx → C#·C++)와 C# 테스트(mmo.slnx). 엔진이 필요한 클라이언트 검사와
# 빌드는 로컬에서 하고(mmo/docs/backlog.md), 클라이언트의 엔진 없는 검사는 그 클라이언트를 시작할 때 워크플로를 따로 더한다.
# 영역 폴더의 규칙은 scripts/check.mjs와 함께 고친다.
name: mmo CI

on:
  push:
    branches: [main]
    paths:
      - "mmo/**"
      # data-tool이 mmo/data/의 xlsx를 생성 파일로 바꾼다.
      - "tools/**"
      - "scripts/generate.mjs"
      # test:mmo가 여기에 있다.
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      # 테스트가 읽는 xlsx를 LFS로 받을지 정한다.
      - ".gitattributes"
      - ".github/workflows/mmo-ci.yml"
      # 어떤 테스트도 문서를 읽지 않는다. 제외는 맨 뒤에 둬야 앞의 포함을 덮는다.
      - "!**/*.md"
  pull_request:
    paths:
      - "mmo/**"
      # data-tool이 mmo/data/의 xlsx를 생성 파일로 바꾼다.
      - "tools/**"
      - "scripts/generate.mjs"
      # test:mmo가 여기에 있다.
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      # 테스트가 읽는 xlsx를 LFS로 받을지 정한다.
      - ".gitattributes"
      - ".github/workflows/mmo-ci.yml"
      - "!**/*.md"
  workflow_dispatch:

# 같은 PR(또는 브랜치)에 새 커밋이 오면 이전 실행을 취소해 무료 시간을 아낀다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    # 멈춘 테스트가 기본 한도(360분)까지 무료 시간을 쓰지 않게 한다.
    timeout-minutes: 10
    steps:
      # lfs가 꺼져 있으면 LFS 파일은 포인터로만 받는다.
      - uses: actions/checkout@v7
      # 테스트가 읽는 LFS 파일은 generate --check의 xlsx뿐이다. Unreal 에셋 등 나머지는 받지 않는다.
      # LFS 필터가 설정되지 않은 저장소에서는 pull이 받기만 하고 파일을 바꾸지 않으므로 먼저 설치한다.
      - run: |
          git lfs install --local
          git lfs pull --include="mmo/data/*.xlsx"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # generate --check가 data-tool(exceljs)을 돌린다.
      - run: npm ci
      # 패킷과 데이터 코드 생성(Google.Protobuf.Tools의 protoc)과 C# 테스트가 쓴다.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: npm run test:mmo
