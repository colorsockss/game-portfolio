# 키우기: 게임 서버만 배포한다. 바로 공개는 규칙 지문과 idle/shared/가 Live 패치와 같을 때만 된다. 규칙 테이블이 바뀐 패치(idle data가
# 올리기만 한 것)와 함께 낼 때는 publish를 끄고 올려 둔 뒤 공개·롤백 액션으로 함께 공개한다. 일은 공용 워크플로(idle-release.yml)가 한다. 설계: idle/docs/superpowers/specs/2026-10-30-patch-design.md 4.12절.
name: idle server

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 바로 다시 시작(끄면 올리기만 함. 규칙 테이블이 바뀐 패치와 함께 낼 때는 끄고, 공개·롤백 액션으로 함께 공개)
        type: boolean
        default: true

# 모든 내보내기 액션이 한 그룹이라 한 번에 하나씩 돈다. 앞 실행을 취소하면 반쯤 내보낸 채 멈추므로 기다린다.
concurrency:
  group: idle-live
  cancel-in-progress: false

permissions:
  # GitHub Release와 태그를 만든다(APK).
  contents: write

jobs:
  release:
    uses: ./.github/workflows/idle-release.yml
    with:
      server: true
      publish: ${{ inputs.publish }}
    secrets: inherit
