# 키우기 Live 내보내기의 공용 워크플로. 단위 액션(idle-data.yml 등)이 정해진 단위로 부른다. 고른 단위만 이번 커밋에서
# 만들고 나머지는 기준 버전(기본은 그 API 채널의 지금 버전)에서 가져오며, 서버나 앱과 맞지 않는 조합은 내보내기 전에 멈춘다.
# 올리기는 더하기만 하고, 공개(publish)가 서버를 맞춘 뒤 채널 포인터를 옮긴다. 롤백은 앞 버전의 공개(publish_version)다.
# 설계: idle/docs/superpowers/specs/2026-10-30-patch-design.md 4.12절.
name: idle release (shared)

on:
  workflow_call:
    inputs:
      game:
        type: boolean
        default: false
      rules:
        type: boolean
        default: false
      strings:
        type: boolean
        default: false
      assets:
        type: boolean
        default: false
      server:
        type: boolean
        default: false
      apk:
        type: boolean
        default: false
      base:
        type: string
        default: ''
      publish:
        type: boolean
        default: true
      publish_version:
        type: string
        default: ''

# 숨길 필요가 없는 값은 vars에 둔다. secrets는 로그에서 같은 글자를 모두 가려서, 값이 idle이나 deploy면 로그를 읽을 수 없다.
env:
  VPS_HOST: ${{ vars.VPS_HOST }}
  VPS_USER: ${{ vars.VPS_USER }}
  PATCH_TARGET: ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/srv/idle/patch

jobs:
  release:
    if: inputs.publish_version == ''
    runs-on: ubuntu-24.04
    # Unity 이미지와 IL2CPP 빌드가 길다. 멈춘 실행이 기본 한도(360분)까지 무료 시간을 쓰지 않게 한다.
    timeout-minutes: 120
    env:
      UNITY: ${{ inputs.assets || inputs.apk }}
    steps:
      - name: Plan the run
        id: plan
        env:
          GAME: ${{ inputs.game }}
          RULES: ${{ inputs.rules }}
          STRINGS: ${{ inputs.strings }}
          ASSETS: ${{ inputs.assets }}
          SERVER: ${{ inputs.server }}
          APK: ${{ inputs.apk }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          parts=""
          if [ "$GAME" = true ]; then parts="$parts,game"; fi
          if [ "$RULES" = true ]; then parts="$parts,rules"; fi
          if [ "$STRINGS" = true ]; then parts="$parts,strings"; fi
          if [ "$ASSETS" = true ]; then parts="$parts,assets"; fi
          parts=${parts#,}
          if [ -z "$parts" ] && [ "$SERVER" != true ] && [ "$APK" != true ]; then
            echo "::error::Choose at least one unit."; exit 1
          fi
          # 공개하지 않은 채널로 앱을 내면 설치한 앱이 패치를 받지 못한다.
          if [ "$APK" = true ] && [ "$PUBLISH" != true ]; then
            echo "::error::An APK release always publishes."; exit 1
          fi
          echo "parts=$parts" >> "$GITHUB_OUTPUT"
          # 이번 실행이 조합한 패치를 더하는 로컬 버킷. 작업 트리 밖에 둔다(tools/patch.mjs upload가 올림).
          echo "PATCH_BUCKET=$RUNNER_TEMP/bucket" >> "$GITHUB_ENV"
          echo "Units: ${parts:-none}, server $SERVER, apk $APK, publish $PUBLISH"

      # Unity 이미지, Library, IL2CPP 출력이 러너의 기본 여유 공간보다 크다. Unity가 쓰지 않는 도구를 지운다(컨테이너에 자기 JDK와
      # Android SDK가 있음). Library 캐시(풀면 약 8 GB)를 받은 첫 실행(2026-11-02)이 Unity 이미지를 받다가 디스크가 모자라 멈춰서,
      # 도구 캐시의 내용(폴더는 setup-node가 써야 하므로 남기고 Node는 다시 받음)과 미리 받아 둔 Docker 이미지도 지운다.
      - name: Free disk space
        if: env.UNITY == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/* \
            /usr/share/swift /usr/lib/jvm /usr/local/share/powershell /usr/local/share/chromium /usr/local/share/boost \
            /opt/microsoft /opt/google /opt/az /usr/share/miniconda
          docker image prune --all --force > /dev/null
          df -h / /mnt
      # 비공개 저장소 때의 2 vCPU 러너는 메모리가 약 7.9 GB라 넘치면 커널이 Unity를 죽였다(2026-10-31 APK 빌드, exit 137). 2026-11-02에
      # 공개 저장소가 된 뒤의 4 vCPU 러너는 약 16 GB지만, 스왑을 더해 둔다.
      # 임시 디스크(/mnt)가 있으면 거기에 둬 루트를 Unity 이미지와 Library에 남긴다.
      - name: Add swap
        if: env.UNITY == 'true'
        run: |
          swap=/swapfile-idle
          if mountpoint -q /mnt; then swap=/mnt/swapfile-idle; fi
          sudo fallocate -l 8G "$swap"
          sudo chmod 600 "$swap"
          sudo mkswap "$swap"
          sudo swapon "$swap"
          free -m
          df -h / /mnt

      # 조합 검사가 다른 커밋의 idle/shared/와 견주므로 기록 전체를 받는다.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Unity 빌드는 LFS 전체가 필요하다. 바뀐 객체만 받도록 .git/lfs를 목록의 해시로 캐시한다(무료 전송 월 10 GiB). 그 밖의
      # 실행은 테스트가 읽는 xlsx만 받는다.
      # Unity 실행의 캐시(LFS, PuerTS, Library)는 채운 직후에 저장한다. 잡 끝(post)에 저장하면 뒤의 단계가 실패한 실행이
      # 아무것도 남기지 못한다(2026-11-02 idle assets: Unity 빌드는 성공했는데 조합 검사에서 멈춰 캐시가 없었음).
      - name: List LFS objects
        if: env.UNITY == 'true'
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-objects
      - uses: actions/cache/restore@v6
        id: lfs
        if: env.UNITY == 'true'
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}
          restore-keys: lfs-
      - name: Pull LFS files
        run: |
          git lfs install --local
          if [ "$UNITY" = true ]; then git lfs pull; else git lfs pull --include="idle/data/*.xlsx"; fi
      - uses: actions/cache/save@v6
        if: env.UNITY == 'true' && steps.lfs.outputs.cache-hit != 'true'
        with:
          path: .git/lfs
          key: ${{ steps.lfs.outputs.cache-primary-key }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # PuerTS(약 270 MB)는 Unity만 쓴다. 설치 스크립트가 같으면 다시 받지 않는다.
      - uses: actions/cache/restore@v6
        id: puerts
        if: env.UNITY == 'true'
        with:
          path: |
            idle/client/Packages/core
            idle/client/Packages/v8
            idle/client/Packages/.puerts-*
          key: puerts-${{ hashFiles('idle/client/TypeScript/tools/install-puerts.mjs') }}
      - if: env.UNITY == 'true'
        run: npm run setup
      - uses: actions/cache/save@v6
        if: env.UNITY == 'true' && steps.puerts.outputs.cache-hit != 'true'
        with:
          path: |
            idle/client/Packages/core
            idle/client/Packages/v8
            idle/client/Packages/.puerts-*
          key: ${{ steps.puerts.outputs.cache-primary-key }}
      # 키우기만 검사한다(idle-ci.yml과 같음). 툴과 mmo는 각자의 CI가 보므로 mmo의 실패가 Live 내보내기를 막지 않는다.
      - run: npm run typecheck:idle
      - run: npm run test:idle

      # 배포 키로만 들어가고, 처음 보는 호스트 키는 믿지 않는다. 기준 버전과 Live 서버를 읽는 데도 쓴다.
      - name: SSH to the VPS
        uses: ./.github/actions/vps-ssh
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          host: ${{ env.VPS_HOST }}
          user: ${{ env.VPS_USER }}

      - name: Read the live state
        id: live
        run: |
          # 파이프로 받으면 ssh가 실패해도 단계가 이어지므로(빈 값이 "서버 없음"이 됨) 따로 받는다.
          current=$(ssh "$VPS_HOST" 'readlink /srv/idle/server/current || true')
          server=${current##*/}
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "Live server: ${server:-none}"

      # 패치 네 단위를 모두 고르지 않았으면 나머지는 기준 버전에서 온다. 서버나 APK만 내도 지금 Live 패치를 받아 견준다. 이 커밋의
      # API 채널이 없으면(새 API) 여기서 멈추고, 그때는 패치 네 단위를 모두 내야 한다.
      - name: Pull the base version
        if: steps.plan.outputs.parts != 'game,rules,strings,assets'
        env:
          BASE: ${{ inputs.base }}
        run: npm run --silent patch -w @idle/client -- pull "${BASE:-current}" "$RUNNER_TEMP/base"

      # 패치와 함께 돌 서버를 정한다. 서버를 고르면 이번 커밋이고, 아니면 지금 Live 서버다. 다만 규칙 테이블을 골랐는데 이 커밋의
      # 규칙이 Live 서버와 다르면 이 커밋의 서버가 짝이다(paired). 그 서버는 아직 VPS에 없으므로 이번에는 올리기만 하고, idle server를
      # publish를 끈 채 돌려 올려 둔 뒤 idle publish / rollback이 서버와 패치를 함께 바꾼다(4.12절).
      - name: Pair the patch with a server
        id: pair
        if: steps.plan.outputs.parts != ''
        env:
          PARTS: ${{ steps.plan.outputs.parts }}
          SERVER: ${{ inputs.server }}
          LIVE_SERVER: ${{ steps.live.outputs.server }}
        run: |
          if [ "$SERVER" = true ]; then echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"; exit 0; fi
          test -n "$LIVE_SERVER" || { echo "::error::No game server is live yet; release the server too."; exit 1; }
          rsync -rt "$VPS_HOST:/srv/idle/server/releases/$LIVE_SERVER/data/" "$RUNNER_TEMP/server-data/"
          live=$(node idle/client/TypeScript/tools/data-schema.mjs "$RUNNER_TEMP/server-data")
          ours=$(node idle/client/TypeScript/tools/data-schema.mjs idle/shared/data-schema/data)
          if [[ ",$PARTS," == *,rules,* ]] && [ "$ours" != "$live" ]; then
            echo "Rule tables $ours differ from the live server's $live; pairing the patch with this commit's server."
            echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "paired=true" >> "$GITHUB_OUTPUT"
          else
            echo "commit=$LIVE_SERVER" >> "$GITHUB_OUTPUT"
          fi

      # Unity의 Library(가져온 에셋과 컴파일 결과). 실행마다 새로 저장하고 가장 최근 것을 받는다(같은 키면 저장을 건너뛰어
      # 첫 실행의 Library에 머물므로). 지난 것은 GitHub가 지운다(7일 동안 쓰지 않거나 저장소 합계가 10 GB를 넘으면).
      - uses: actions/cache/restore@v6
        id: library
        if: env.UNITY == 'true'
        with:
          path: idle/client/Library
          key: library-android-${{ hashFiles('idle/client/Packages/packages-lock.json', 'idle/client/ProjectSettings/**') }}-${{ github.run_id }}
          restore-keys: |
            library-android-${{ hashFiles('idle/client/Packages/packages-lock.json', 'idle/client/ProjectSettings/**') }}-
            library-android-
      # APK 번호(versionCode, 버전 이름, Release 태그)는 저장소 전체에서 늘어야 한다. github.run_number는 부른 액션마다 1부터 따로
      # 세므로 이미 낸 것보다 낮은 번호가 나와 덮어 설치할 수 없다. 지금까지의 Release 태그(idle-android-b<번호>)에서 가장 큰 번호의
      # 다음을 쓴다. 모든 내보내기가 한 concurrency 그룹이라 두 실행이 같은 번호를 고르지 않는다.
      - name: Number the APK
        id: apk_number
        if: inputs.apk
        run: |
          last=$(git ls-remote --tags origin 'refs/tags/idle-android-b*' | sed -n 's|.*refs/tags/idle-android-b\([0-9][0-9]*\)$|\1|p' | sort -n | tail -1)
          echo "value=$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"
          echo "APK number $(( ${last:-0} + 1 ))"
      # 부트 번들은 앱에 든다(Resources). 플레이어 빌드 전처리가 그것과 Release 환경을 요구하므로 Unity보다 먼저 만든다. 패치는
      # 에셋 카탈로그가 나온 뒤에 따로 만들므로, 여기서 함께 나오는 게임 번들은 버린다.
      - name: Build the boot bundle
        id: boot
        if: inputs.apk
        working-directory: idle/client
        run: |
          jq '.EnvironmentName = "Release"' Assets/Resources/TypeScriptRuntimeSettings.json > settings.tmp
          mv settings.tmp Assets/Resources/TypeScriptRuntimeSettings.json
          npm run build:release -w @idle/client -- "--bucket=$RUNNER_TEMP/boot-only" "--report=$GITHUB_OUTPUT"

      # Unity는 한 번만 띄운다. APK를 내면 같은 실행에서 원격 콘텐츠까지 빌드한다(PlayerBuild.BuildForCi). Unity Personal은
      # 계정(이메일·비밀번호)으로 좌석을 받는다. 라이선스 파일(.ulf)은 만든 컴퓨터에 묶여 CI 컨테이너에서 거절되므로 넘기지 않는다.
      - name: Build remote content
        if: inputs.assets && !inputs.apk
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: idle/client
          targetPlatform: Android
          # 플레이어를 만들지 않으므로 GameCI가 성공으로 읽는 줄을 남기는 진입점을 쓴다.
          buildMethod: PortfolioIdleRpg.Editor.RemoteContent.BuildForCi
          # 작업 트리에 빌드 출력과 고친 설정이 있다.
          allowDirtyBuild: true
      # GameCI의 기본 빌드 스크립트는 쓰지 않는다. 그것을 쓴 두 번의 실행(2026-10-31)이 Unity가 어셈블리를 불러오다 메모리 부족
      # 없이 죽었다(exit 137). 출력 경로, versionCode, 키스토어는 GameCI가 넘기는 인자를 PlayerBuild.BuildForCi가 읽는다.
      - name: Build the APK
        if: inputs.apk
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: idle/client
          targetPlatform: Android
          buildMethod: PortfolioIdleRpg.Editor.PlayerBuild.BuildForCi
          buildsPath: build
          buildName: idle
          allowDirtyBuild: true
          customParameters: -idleEnvironment live${{ inputs.assets && ' -idleRemoteContent' || '' }}
          versioning: Custom
          version: 0.1.${{ steps.apk_number.outputs.value }}
          androidVersionCode: ${{ steps.apk_number.outputs.value }}
          androidExportType: androidPackage
          androidKeystoreName: idle.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ vars.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
      # Unity 빌드가 성공했을 때만 여기 온다(앞 단계가 실패하면 건너뜀). 뒤의 조합 검사나 내보내기가 실패해도 Library가 남는다.
      - uses: actions/cache/save@v6
        if: env.UNITY == 'true'
        with:
          path: idle/client/Library
          key: ${{ steps.library.outputs.cache-primary-key }}

      # 조합한 패치. 고르지 않은 단위는 기준 버전에서 오고, assets를 골랐으면 위 Unity가 만든 카탈로그와 번들을 쓴다.
      - name: Build the patch
        id: patch
        if: steps.plan.outputs.parts != ''
        working-directory: idle/client
        env:
          PARTS: ${{ steps.plan.outputs.parts }}
          # 이 패치와 함께 돌 서버(위에서 정함).
          SERVER_COMMIT: ${{ steps.pair.outputs.commit }}
        run: |
          # 빌드가 낸 채널의 api, version, 버전 폴더(folder)를 이 단계의 출력으로 남긴다.
          args=("--bucket=$PATCH_BUCKET" "--report=$GITHUB_OUTPUT")
          if [ -n "$SERVER_COMMIT" ]; then args+=("--server=$SERVER_COMMIT"); fi
          if [ "$PARTS" != game,rules,strings,assets ]; then args+=("--parts=$PARTS" "--base=$RUNNER_TEMP/base"); fi
          BUILD_NUMBER=${{ github.run_id }} npm run build:release -w @idle/client -- "${args[@]}"

      - name: Build the game server
        if: inputs.server
        run: npm run build -w @idle/server

      # 내보내기 전에 조합을 본다: 규칙 테이블 지문과 idle/shared/가 함께 돌 서버와 같아야 한다. 패치는 짝 서버와 견주고, 서버만
      # 바로 내면 지금 Live 패치(기준 버전)와 견준다. 서버를 올려 두기만 하면 견주지 않는다(공개할 패치가 만들 때 이미 견줌).
      - name: Check the units fit together
        if: steps.plan.outputs.parts != '' || (inputs.server && inputs.publish)
        env:
          PARTS: ${{ steps.plan.outputs.parts }}
          FOLDER: ${{ steps.patch.outputs.folder }}
          PAIRED_SERVER: ${{ steps.pair.outputs.commit }}
        run: |
          if [ -n "$PARTS" ]; then patch="$FOLDER"; commit=$PAIRED_SERVER; else patch="$RUNNER_TEMP/base"; commit=$GITHUB_SHA; fi
          # 이 커밋의 서버는 idle/shared/data-schema/data를 그대로 싣는다(server/tools/build.mjs).
          if [ "$commit" = "$GITHUB_SHA" ]; then data=idle/shared/data-schema/data; else data="$RUNNER_TEMP/server-data"; fi
          node idle/client/TypeScript/tools/release-check.mjs --patch="$patch" --server-data="$data" --server-commit="$commit"

      # 패치를 받을 앱이 있어야 한다: 이번에 APK를 내거나, 그 API로 빌드된 APK가 Release에 있어야 한다.
      - name: Check an app can run the patch
        if: steps.plan.outputs.parts != '' && !inputs.apk
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ steps.patch.outputs.api }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].body' | grep -q "API 지문: $API"; then
            echo "::error::No released APK runs API $API; release the APK with a full patch (idle-apk)."; exit 1
          fi

      # Unity가 죽었으면 누가 죽였는지 남긴다. 커널 OOM은 dmesg에, systemd-oomd는 저널에만 남고, 도커는 컨테이너의 OOMKilled를
      # 적는다(2026-11-06 dmesg에 아무 기록 없이 SIGKILL이 이어짐). 어느 것도 실패를 바꾸지 않으므로 명령마다 실패를 넘긴다.
      - name: Report why Unity stopped
        if: failure() && env.UNITY == 'true'
        run: |
          free -m
          df -h /
          echo "--- memory pressure"; cat /proc/pressure/memory || true
          echo "--- dmesg"; sudo dmesg -T | tail -60 || true
          echo "--- systemd-oomd: $(systemctl is-active systemd-oomd || true)"
          sudo journalctl --no-pager -u systemd-oomd --since "-45 min" | tail -20 || true
          echo "--- journal kills"; sudo journalctl --no-pager --since "-45 min" | grep -iE 'oom|killed|sigkill|out of memory' | tail -40 || true
          echo "--- containers"
          for id in $(docker ps -aq | head -5); do
            docker inspect --format '{{.Name}} {{.Config.Image}} OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} Error={{.State.Error}}' "$id" || true
          done

      # 여기부터 내보낸다. 올리기는 더하기만 하므로 Live에 영향이 없다.
      - name: Stage the game server
        if: inputs.server
        run: |
          idle/server/deploy/deploy.sh "$GITHUB_SHA" --stage
          echo "Server \`${GITHUB_SHA:0:7}\` is on the VPS." >> "$GITHUB_STEP_SUMMARY"
      # 실행 페이지 맨 위(요약)에 올린 버전을 남긴다. idle publish / rollback의 version이나 다음 실행의 base에 넣는 값이다.
      - name: Upload the patch
        if: steps.plan.outputs.parts != ''
        env:
          VERSION: ${{ steps.patch.outputs.version }}
          API: ${{ steps.patch.outputs.api }}
          PARTS: ${{ steps.plan.outputs.parts }}
          SERVER_COMMIT: ${{ steps.pair.outputs.commit }}
        run: |
          npm run patch -w @idle/client -- upload
          {
            echo "### Patch \`$VERSION\` uploaded"
            echo "API \`$API\`, units from this commit: $PARTS, runs with server \`${SERVER_COMMIT:0:7}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # 공개: 서버를 이 패치와 함께 돌 서버로 맞춘 뒤 포인터를 옮긴다(idle/server/deploy/publish.sh).
      - name: Publish
        if: inputs.publish
        env:
          PARTS: ${{ steps.plan.outputs.parts }}
          VERSION: ${{ steps.patch.outputs.version }}
          SERVER_COMMIT: ${{ steps.pair.outputs.commit || (inputs.server && github.sha) || steps.live.outputs.server }}
          PAIRED: ${{ steps.pair.outputs.paired }}
        run: |
          if [ "$PAIRED" = true ]; then
            message="Uploaded $VERSION without publishing: its rule tables need the server from $GITHUB_SHA. Run idle server from this commit with publish off, then idle publish / rollback with version $VERSION."
            echo "::notice::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # 패치 없이 서버만 내면 포인터는 그대로다.
          if [ -z "$PARTS" ]; then VERSION=; fi
          idle/server/deploy/publish.sh "$SERVER_COMMIT" "$VERSION"

      - name: Publish the APK
        if: inputs.apk
        env:
          GH_TOKEN: ${{ github.token }}
          # 앱의 API(부트 번들의 것). 패치만 내는 다음 실행이 이것으로 받을 앱이 있는지 본다.
          API: ${{ steps.boot.outputs.api }}
          PARTS: ${{ steps.plan.outputs.parts }}
          VERSION: ${{ steps.patch.outputs.version }}
        run: |
          apk=$(find build -name '*.apk' | head -1)
          test -n "$apk" || { echo "::error::The Unity build left no APK."; exit 1; }
          # APK만 내면 채널은 그대로이므로 지금 Live 패치(기준 버전)를 적는다.
          if [ -z "$PARTS" ]; then patch=$(jq -r .version "$RUNNER_TEMP/base/manifest.json"); else patch=$VERSION; fi
          tag="idle-android-b${{ steps.apk_number.outputs.value }}"
          gh release create "$tag" "$apk" --target "$GITHUB_SHA" \
            --title "idle aos build ${{ steps.apk_number.outputs.value }}" \
            --notes "API 지문: $API
          패치 버전: $patch
          빌드 번호(versionCode): ${{ steps.apk_number.outputs.value }}
          실행: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          커밋: $GITHUB_SHA"
          # API가 다른 앱은 부트에서 이 Release를 열라는 안내를 받는다(update.ts의 APP). 포인터를 옮긴 뒤라 새 앱이 받을 패치가 있다.
          npm run patch -w @idle/client -- app "$API" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag"
          echo "### APK idle aos build ${{ steps.apk_number.outputs.value }} released (patch \`$patch\`)" >> "$GITHUB_STEP_SUMMARY"

  # 올려 둔 버전을 공개한다: 그 버전과 함께 돌 서버로 맞추고 포인터를 옮긴다. 앞 버전이면 롤백이다.
  publish:
    if: inputs.publish_version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # patch.mjs가 런타임의 update.ts를 esbuild로 불러온다(tools/update.mjs).
      - run: npm ci
      - name: SSH to the VPS
        uses: ./.github/actions/vps-ssh
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          host: ${{ env.VPS_HOST }}
          user: ${{ env.VPS_USER }}
      - name: Publish the version
        env:
          VERSION: ${{ inputs.publish_version }}
        run: |
          node idle/client/TypeScript/tools/patch.mjs pull "$VERSION" "$RUNNER_TEMP/version"
          server=$(jq -r '.server // empty' "$RUNNER_TEMP/version/manifest.json")
          if [ -z "$server" ]; then echo "::warning::$VERSION records no server; only the channel pointer moves."; fi
          idle/server/deploy/publish.sh "$server" "$VERSION"
