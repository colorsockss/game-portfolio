<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>몬스터·보스·소환수 7종</title>
<style>body{margin:24px;background:#f7f5ef;color:#302a23;font:15px system-ui}h1{font-size:23px}p{line-height:1.65}button,select{padding:8px 11px;margin:0 5px 7px 0;border:1px solid #b7ac9c;border-radius:8px;background:white;cursor:pointer}button[aria-pressed=true]{background:#dce8d2}.viewport{overflow:auto}canvas{display:block}a{color:#315580}</style>
<h1>몬스터·보스·소환수 7종</h1><p>단색 색면과 짧은 팔다리로 통일했습니다. 용사를 기준으로 같은 배율로 비교합니다.<br>일반 4종·소환수 1종은 각 17프레임, 보스 2종은 특수 공격을 포함해 각 22프레임입니다.</p>
<div id="states"></div><div><button id="play">일시정지</button><button id="prev">이전 프레임</button><button id="next">다음 프레임</button><span id="frame"></span></div>
<label>화면 너비 <select id="size"><option>360</option><option>540</option><option>1080</option></select>px</label> <label>방향 <select id="facing"><option value="1">오른쪽 원본 →</option><option value="-1">왼쪽 반전 ←</option></select></label>
<div class="viewport"><canvas id="view" aria-label="용사와 새 캐릭터 7종의 실제 표시 크기"></canvas></div>
<p>브라우저 배율 100%에서 선택한 게임 화면 너비에 맞는 표시 크기입니다. 특수 공격이 없는 캐릭터는 대기로 표시합니다.<br>원본은 모두 오른쪽을 보며, 게임에서 적은 좌우 반전합니다.</p><p><a href="preview-360.png">같은 배율 정지 비교</a> · <a href="../../../docs/art.md">제작·적용 기록</a></p>
<script>
const actors=[{"key": "hero", "name": "용사 (비교 기준)", "size": 1, "kind": "hero"}, {"key": "goblin_shaman", "name": "고블린 주술사", "size": 0.75, "kind": "normal"}, {"key": "poison_slime", "name": "독 슬라임", "size": 0.5, "kind": "normal"}, {"key": "rock_golem", "name": "바위 골렘", "size": 1.05, "kind": "normal"}, {"key": "frost_wolf", "name": "서리 늑대", "size": 0.8, "kind": "normal"}, {"key": "ogre_chief", "name": "오우거 대장", "size": 1.65, "kind": "boss"}, {"key": "fire_dragon", "name": "화염 드래곤", "size": 1.9, "kind": "boss"}, {"key": "spirit_wolf", "name": "정령 늑대", "size": 0.9, "kind": "summon"}],counts={idle:2,walk:4,enter:2,attack:4,hit:2,die:3,special:5},fps={idle:4,walk:8,enter:8,attack:12,hit:12,die:10,special:8},labels={idle:'대기',walk:'걷기',enter:'등장',attack:'공격',hit:'피격',die:'사망',special:'보스 특수 공격'};
let state='walk',frame=0,playing=true,last=0;const images={},canvas=document.querySelector('#view'),ctx=canvas.getContext('2d'),size=document.querySelector('#size'),facing=document.querySelector('#facing');
for(const a of actors)for(const key of Object.keys(counts)){if((a.kind==='hero'&&key==='enter')||(a.kind!=='boss'&&key==='special'))continue;const im=new Image();im.src=`../../actors/${a.key}/${key}.png?v=remaining-20261028`;images[a.key+'/'+key]=im;im.onload=draw}
function draw(){const ratio=+size.value/360;canvas.width=+size.value;canvas.height=Math.round(1020*ratio);ctx.scale(ratio,ratio);ctx.fillStyle='#f2f0e9';ctx.fillRect(0,0,360,1020);let baseline=95;actors.forEach((a,row)=>{if(row)baseline+=a.kind==='boss'?160:105;const key=((a.kind==='hero'&&state==='enter')||(a.kind!=='boss'&&state==='special'))?'idle':state;const im=images[a.key+'/'+key];ctx.fillStyle='#302a23';ctx.font='12px system-ui';ctx.fillText(a.name,8,baseline-20);ctx.fillStyle='#6e6559';ctx.fillText(a.size+'배',8,baseline);if(!im?.complete||!im.naturalWidth)return;const cell=im.naturalHeight,ix=key===state?frame%counts[key]:0,scale=64*a.size/150,side=cell*scale;ctx.save();ctx.translate(230,baseline-(cell/2+64)*scale);ctx.scale(+facing.value,1);ctx.drawImage(im,ix*cell,0,cell,cell,-side/2,0,side,side);ctx.restore()});document.querySelector('#frame').textContent=`${frame+1} / ${counts[state]}`}
function pause(){playing=false;document.querySelector('#play').textContent='재생'}
for(const[id,label]of Object.entries(labels)){const b=document.createElement('button');b.textContent=label;b.dataset.state=id;b.onclick=()=>{state=id;frame=0;last=performance.now();document.querySelectorAll('[data-state]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()};b.setAttribute('aria-pressed',id===state);document.querySelector('#states').append(b)}
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'일시정지':'재생'};document.querySelector('#prev').onclick=()=>{pause();frame=(frame+counts[state]-1)%counts[state];draw()};document.querySelector('#next').onclick=()=>{pause();frame=(frame+1)%counts[state];draw()};size.onchange=draw;facing.onchange=draw;
function tick(t){if(playing&&t-last>1000/fps[state]){frame=(frame+1)%counts[state];last=t;draw()}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
