<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>팔 길이 교정 · 오른쪽 원본</title><style>body{margin:24px;background:#f7f5ef;color:#302a23;font:15px system-ui}h1{font-size:22px}p{line-height:1.6}button,select{padding:8px 11px;margin:0 5px 7px 0;border:1px solid #b7ac9c;border-radius:8px;background:white;cursor:pointer}button[aria-pressed=true]{background:#dce8d2}main{max-width:780px}.viewport{overflow:auto}canvas{display:block}a{color:#315580}</style>
<main><h1>팔 길이 교정 · 오른쪽 원본</h1><p>용사는 짧은 팔 길이와 왼손 검을 유지하도록 공격·시전·사망을 교정했습니다.<br>다섯 배우의 모든 최종 시트는 오른쪽을 보고, 게임에서 방향 값에 따라 반전합니다.</p>
<div id="states"></div><div><button id="play">일시정지</button><button id="prev">이전 프레임</button><button id="next">다음 프레임</button><span id="frame"></span></div>
<label>화면 너비 <select id="size"><option>360</option><option>540</option><option>1080</option></select>px</label><div class="viewport"><canvas id="view" width="360" height="442" aria-label="같은 시트의 오른쪽 원본과 왼쪽 반전 비교"></canvas></div>
<p>브라우저 배율 100%에서 게임 표시 크기로 보입니다. 등장·시전이 없는 배우는 대기로 표시합니다.<br>이미지를 반전해도 프레임 순서와 공격 타이밍은 유지합니다.</p>
<p><a href="../../source/actors/hero/prompts.json">용사 생성·교정 기록</a> · <a href="../../../docs/art.md">적용 기록</a></p></main>
<script>
const actors=[['hero',1,'용사'],['green_slime',.45,'슬라임'],['forest_boar',.65,'멧돼지'],['goblin_scout',.75,'정찰병'],['goblin_archer',.75,'궁수']],counts={idle:2,walk:4,enter:2,attack:4,cast:4,hit:2,die:3},labels={idle:'대기',walk:'걷기',enter:'등장',attack:'공격',cast:'시전',hit:'피격',die:'사망'};
let state='attack',frame=0,playing=true,last=0;const images={},canvas=document.querySelector('#view'),ctx=canvas.getContext('2d'),size=document.querySelector('#size');
for(const[a]of actors)for(const key of Object.keys(counts)){if((a==='hero'&&key==='enter')||(a!=='hero'&&key==='cast'))continue;const im=new Image();im.src=`../../actors/${a}/${key}.png?v=knee-right-arm-20261028`;images[a+'/'+key]=im;im.onload=draw}
function draw(){const ratio=+size.value/360;canvas.width=+size.value;canvas.height=Math.round(442*ratio);ctx.scale(ratio,ratio);ctx.fillStyle='#f2f0e9';ctx.fillRect(0,0,360,442);ctx.fillStyle='#302a23';ctx.font='13px system-ui';ctx.textAlign='center';ctx.fillText('원본 →',144,22);ctx.fillText('좌우 반전 ←',280,22);actors.forEach(([a,s,label],row)=>{let key=((a==='hero'&&state==='enter')||(a!=='hero'&&state==='cast'))?'idle':state;const im=images[a+'/'+key];if(!im?.complete||!im.naturalWidth)return;const cell=im.naturalHeight,ix=key===state?frame%counts[key]:0,scale=64*s/150,side=cell*scale,baseline=106+row*79;ctx.fillStyle='#302a23';ctx.font='12px system-ui';ctx.textAlign='left';ctx.fillText(label,8,baseline-20);for(const[x,flip]of[[144,false],[280,true]]){ctx.save();ctx.translate(x,baseline-(cell/2+64)*scale);ctx.scale(flip?-1:1,1);ctx.drawImage(im,ix*cell,0,cell,cell,-side/2,0,side,side);ctx.restore()}});document.querySelector('#frame').textContent=`${frame+1} / ${counts[state]}`}
function pause(){playing=false;document.querySelector('#play').textContent='재생'}
for(const[id,label]of Object.entries(labels)){const b=document.createElement('button');b.textContent=label;b.dataset.state=id;b.onclick=()=>{state=id;frame=0;document.querySelectorAll('[data-state]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()};b.setAttribute('aria-pressed',id===state);document.querySelector('#states').append(b)}
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'일시정지':'재생'};document.querySelector('#prev').onclick=()=>{pause();frame=(frame+counts[state]-1)%counts[state];draw()};document.querySelector('#next').onclick=()=>{pause();frame=(frame+1)%counts[state];draw()};size.onchange=draw;
function tick(t){if(playing&&t-last>(state==='attack'?130:160)){frame=(frame+1)%counts[state];last=t;draw()}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
