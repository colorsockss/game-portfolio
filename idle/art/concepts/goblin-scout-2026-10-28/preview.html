<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>고블린 정찰병 · 게임 적용</title><style>body{margin:24px;background:#f7f5ef;color:#302a23;font:15px system-ui}h1{font-size:22px}button{padding:8px 12px;margin:0 5px 6px 0;border:1px solid #b7ac9c;border-radius:8px;background:white;cursor:pointer}img{display:block;max-width:none}p{line-height:1.6}main{max-width:720px}</style><main><h1>고블린 정찰병</h1><p>갈색 후드·큰 귀·작은 단검을 가진 일반 몬스터입니다.<br>단색 6색, 걷기 포함 6개 동작·17프레임을 게임에 적용했습니다.</p><div id="buttons"></div><img id="clip" src="walk.gif" width="360" height="178"><p>화면 너비 360px 기준 비교입니다. 브라우저 배율 100%로 보세요.<br>슬라임·멧돼지는 대기 첫 자세이며 고블린 동작을 바꿔 볼 수 있습니다.</p><p><a href="unity-walk.png">실제 전투 걷기 캡처</a> · <a href="unity-attack.png">실제 전투 공격 캡처</a></p></main><script>for(const[id,label]of Object.entries({idle:'대기',walk:'걷기',enter:'등장',attack:'공격',hit:'피격',die:'사망'})){const b=document.createElement('button');b.textContent=label;b.onclick=()=>document.querySelector('#clip').src=id+'.gif';document.querySelector('#buttons').append(b)}</script></html>
