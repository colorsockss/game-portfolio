// MMO의 모든 패킷. 서버(C#), Unity(C#), Unreal(C++)이 이 파일에서 protoc로 생성한 코드를 쓴다.
// 프레임은 protobuf의 길이 구분 형식(varint 길이 + Packet)이다. 배포된 필드 번호와 enum 값은 바꾸거나 다시 쓰지 않는다.
syntax = "proto3";

package portfolio.mmo;

option csharp_namespace = "PortfolioMmo.Contract";

// 주고받는 패킷 하나. body의 필드 번호가 패킷 번호이고, 기능마다 범위 하나를 쓴다.
message Packet {
  oneof body {
    // 1–99: 세션(로그인과 연결 끊기)
    Login login = 1;
    LoginResult login_result = 2;
    Kicked kicked = 3;
    Ping ping = 4;
    Pong pong = 5;
    CharacterList character_list = 6;
    CreateCharacter create_character = 7;
    CreateCharacterResult create_character_result = 8;
    EnterWorld enter_world = 9;
    EnterWorldResult enter_world_result = 10;
    LeaveWorld leave_world = 11;
    ActionFailed action_failed = 12;
    DevCommand dev_command = 13;

    // 100–199: 월드(이동과 시야)
    Move move = 100;
    PositionReset position_reset = 101;
    EntitiesEnter entities_enter = 102;
    EntitiesLeave entities_leave = 103;
    EntityMoves entity_moves = 104;
    EntityState entity_state = 105;

    // 200–299: 전투
    SelfVitals self_vitals = 200;
    EntityVitals entity_vitals = 201;
    AttackStart attack_start = 202;
    AttackStop attack_stop = 203;
    AttackSwing attack_swing = 204;
    Damaged damaged = 205;
    Died died = 206;
    Revive revive = 207;
    Revived revived = 208;
    UseSkill use_skill = 209;
    SkillUsed skill_used = 210;
    Progress progress = 211;
    ProgressCancelled progress_cancelled = 212;
    EffectApplied effect_applied = 213;
    Cooldowns cooldowns = 214;
    ProjectileLaunched projectile_launched = 215;
    ProjectileEnded projectile_ended = 216;

    // 300–399: 성장과 아이템
    SelfStats self_stats = 300;
    ExpGained exp_gained = 301;
    Inventory inventory = 302;
    InventoryChanged inventory_changed = 303;
    UseItem use_item = 304;
    RequestResult request_result = 305;
  }
}

// 프로토콜 버전. 옛 클라이언트를 받을 수 없게 패킷의 뜻이 바뀌면 CURRENT를 올린다.
// 필드를 더하기만 하면 protobuf가 모르는 필드를 건너뛰므로 올리지 않는다.
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  // 2: 로그인과 월드에 들어가기를 나눴다(계정 하나에 캐릭터 여럿, 2026-11-11).
  PROTOCOL_VERSION_CURRENT = 2;
}

// 좌표와 방향. 지면 좌표 x, z는 1 m를 CONSTANT_UNITS_PER_METER칸으로 나눈 정수(sint32)이고 맵은 ±CONSTANT_MAP_HALF_EXTENT_METERS 안이다.
// 위에서 볼 때 +z가 앞(북), +x가 오른쪽(동)이다. 방향 yaw는 한 바퀴(360°)를 CONSTANT_YAW_STEPS칸으로 나눈 칸 번호이고,
// 0이 +z를 보며 위에서 볼 때 시계 방향으로 는다(64가 +x). 높이는 보내지 않고 각자 지면에서 구한다.
// Unity는 x, z와 Y축 회전에 그대로 쓰고, Unreal은 z를 X(앞), x를 Y(오른쪽)에 쓰며 yaw는 같은 방향이다.

// 서버와 두 클라이언트가 함께 쓰는 수. Protobuf에는 상수가 없어서 enum 값으로 두고, C#과 C++이 여기서 생성된다.
enum Constant {
  CONSTANT_UNSPECIFIED = 0;
  // 1 m를 나눈 좌표 칸 수.
  CONSTANT_UNITS_PER_METER = 32;
  // 맵의 반 너비(m). x, z는 이 거리 안이다.
  CONSTANT_MAP_HALF_EXTENT_METERS = 1024;
  // 한 바퀴를 나눈 yaw 칸 수. yaw는 이보다 작다.
  CONSTANT_YAW_STEPS = 256;
  // 서버의 초당 틱 수. EntityMoves.tick이 틱마다 1씩 오른다.
  CONSTANT_TICKS_PER_SECOND = 20;
  // 최대 이동 속도(m/s). 서버가 검증하고 클라이언트의 화면도 쓰는 수라 데이터가 아니라 여기에 둔다.
  CONSTANT_MAX_SPEED_METERS_PER_SECOND = 6;
  // 클라이언트가 Ping을 보내는 간격(초).
  CONSTANT_PING_INTERVAL_SECONDS = 5;
  // 이 시간(초) 동안 아무것도 받지 못하면 서버도 클라이언트도 연결이 죽었다고 보고 끊는다.
  CONSTANT_IDLE_TIMEOUT_SECONDS = 15;
  // 계정 하나가 만들 수 있는 캐릭터 수.
  CONSTANT_MAX_CHARACTERS = 4;
  // 퀵슬롯의 칸 수.
  CONSTANT_QUICKSLOT_COUNT = 8;
}

// ── 세션 ──

// 클라이언트 → 서버. 연결한 뒤 처음 보낸다. 서버는 LoginResult로 답한다.
message Login {
  // 클라이언트의 PROTOCOL_VERSION_CURRENT. 서버와 다르면 VERSION_MISMATCH.
  ProtocolVersion protocol_version = 1;
  // 로그인 ID(계정). 영문 소문자, 숫자, 밑줄 4–16자이고 형식은 서버가 검사한다. 머리 위에는 캐릭터 이름이 보인다.
  string login_id = 2;
  // 클라이언트가 실은 기획 데이터의 해시(data-tool이 낸 mmo/shared/data/files/data.hash. 생성물 전체의 SHA-256 앞 8바이트를
  // 16진수 그대로 읽은 수). 서버와 다르면 DATA_MISMATCH. 태그까지 9바이트다.
  fixed64 data_hash = 3;
}

// 서버 → 클라이언트. Login의 답. 성공하면 이어서 CharacterList가 온다.
message LoginResult {
  LoginResultCode result = 1;
  // 버전 1의 내 개체 번호와 틱. EnterWorldResult로 옮겼다.
  reserved 2, 3;
}

// 로그인의 결과.
enum LoginResultCode {
  // 로그인했다. 이어서 CharacterList가 온다.
  LOGIN_RESULT_CODE_OK = 0;
  // 로그인 ID의 형식이 맞지 않는다.
  LOGIN_RESULT_CODE_INVALID_LOGIN_ID = 1;
  // 클라이언트와 서버의 프로토콜 버전이 다르다. 클라이언트를 업데이트해야 한다.
  LOGIN_RESULT_CODE_VERSION_MISMATCH = 2;
  // 동시 접속이 가득 찼다.
  LOGIN_RESULT_CODE_SERVER_FULL = 3;
  // 클라이언트와 서버의 기획 데이터(테이블, 맵)가 다르다. 클라이언트를 업데이트해야 한다.
  LOGIN_RESULT_CODE_DATA_MISMATCH = 4;
}

// 서버 → 클라이언트. 연결을 끊기 바로 전에 보낸다.
message Kicked {
  KickReason reason = 1;
}

// 서버가 연결을 끊는 까닭.
enum KickReason {
  KICK_REASON_UNSPECIFIED = 0;
  // 같은 ID가 다른 연결에서 로그인했다. 예전 연결을 끊는다.
  KICK_REASON_DUPLICATE_LOGIN = 1;
  // 서버가 내려간다.
  KICK_REASON_SERVER_SHUTDOWN = 2;
  // 읽을 수 없는 패킷을 보냈다.
  KICK_REASON_MALFORMED_PACKET = 3;
  // CONSTANT_IDLE_TIMEOUT_SECONDS 동안 아무것도 보내지 않았다.
  KICK_REASON_IDLE_TIMEOUT = 4;
  // 요청을 너무 자주 보냈다(Constants의 빈도 제한. 버리는 일이 이어진 시간이 끊는 시간을 넘음).
  KICK_REASON_RATE_LIMITED = 5;
}

// 클라이언트 → 서버. 개발 명령 글 한 줄(앞의 /는 있어도 없어도 됨). --dev로 띄운 서버만 실행하고, 아니면 ActionFailed(INVALID_COMMAND, CHAT)로
// 답한다. 월드 안에서만 보내고(들어가기 전에 오면 끊음), 죽은 동안과 기절한 동안에도 실행한다. 명령: "tp x z"(m. 순간 이동),
// "spawn 몬스터번호 [x z]"(m. 없으면 내 자리. 부른 몬스터는 다시 나오지 않음). 레벨·아이템·골드·성향은 그 항목(31, 32, 44)이 더한다.
message DevCommand {
  string line = 1;
}

// 클라이언트 → 서버. 연결이 살아 있음을 알린다. 로그인 전에도 보낼 수 있고, CONSTANT_PING_INTERVAL_SECONDS마다 보낸다.
message Ping {}

// 직업. 만들 때 정하고 바꿀 수 없다.
enum CharacterClass {
  CHARACTER_CLASS_UNSPECIFIED = 0;
  // 근접. 체력과 방어력이 높다.
  CHARACTER_CLASS_KNIGHT = 1;
  // 원거리 마법. 마나와 공격력이 높고 체력이 낮다.
  CHARACTER_CLASS_MAGE = 2;
}

// 캐릭터 선택 화면의 캐릭터 하나.
message CharacterSummary {
  // 캐릭터 번호. 서버가 정하고 바뀌지 않는다. 개체 번호와는 다르다.
  uint64 id = 1;
  string name = 2;
  CharacterClass character_class = 3;
}

// 서버 → 클라이언트. 이 계정의 캐릭터들(만든 차례). 로그인 뒤, 캐릭터를 만든 뒤, LeaveWorld 뒤에 온다.
message CharacterList {
  repeated CharacterSummary characters = 1;
}

// 클라이언트 → 서버. 캐릭터를 만든다. 캐릭터 선택 중에만 보낼 수 있다. 서버는 CreateCharacterResult로 답하고, 성공하면 CharacterList도 보낸다.
message CreateCharacter {
  // 한글·영문·숫자 2–12자. 서버 전체에서 하나이고 영문은 대소문자를 가리지 않는다. 형식은 서버가 검사한다.
  string name = 1;
  CharacterClass character_class = 2;
}

// 서버 → 클라이언트. CreateCharacter의 답.
message CreateCharacterResult {
  CreateCharacterResultCode result = 1;
}

// 캐릭터 만들기의 결과.
enum CreateCharacterResultCode {
  CREATE_CHARACTER_RESULT_CODE_OK = 0;
  // 이름의 형식이 맞지 않는다.
  CREATE_CHARACTER_RESULT_CODE_INVALID_NAME = 1;
  // 같은 이름(영문은 대소문자를 가리지 않음)의 캐릭터가 이미 있다.
  CREATE_CHARACTER_RESULT_CODE_NAME_TAKEN = 2;
  // 이 계정의 캐릭터가 CONSTANT_MAX_CHARACTERS개다.
  CREATE_CHARACTER_RESULT_CODE_TOO_MANY = 3;
  // 없는 직업이다.
  CREATE_CHARACTER_RESULT_CODE_INVALID_CLASS = 4;
}

// 클라이언트 → 서버. 이 캐릭터로 월드에 들어간다. 캐릭터 선택 중에만 보낼 수 있다. 서버는 EnterWorldResult로 답하고,
// 성공하면 이어서 내 개체와 주변 개체가 EntitiesEnter로 온다.
message EnterWorld {
  uint64 character_id = 1;
}

// 서버 → 클라이언트. EnterWorld의 답.
message EnterWorldResult {
  EnterWorldResultCode result = 1;
  // 내 개체 번호. 실패면 0.
  uint32 self_id = 2;
  // 서버의 지금 틱 번호(EntityMoves.tick과 같은 수). 클라이언트가 서버 시계를 맞춘다.
  uint32 tick = 3;
}

// 월드에 들어가기의 결과.
enum EnterWorldResultCode {
  ENTER_WORLD_RESULT_CODE_OK = 0;
  // 이 계정에 그 번호의 캐릭터가 없다.
  ENTER_WORLD_RESULT_CODE_NO_SUCH_CHARACTER = 1;
}

// 클라이언트 → 서버. 캐릭터 선택으로 돌아간다. 월드에 있을 때만 보낼 수 있다. 서버는 캐릭터를 저장하고 월드에서 뺀 뒤
// CharacterList를 보낸다. 연결은 그대로다.
message LeaveWorld {}

// 서버 → 클라이언트. Ping의 답. 움직이는 개체가 없어도 클라이언트가 서버가 살아 있음과 서버의 틱을 안다.
message Pong {
  // 서버의 지금 틱 번호(EntityMoves.tick과 같은 수).
  uint32 tick = 1;
}

// ── 월드 ──

// 클라이언트 → 서버. 내 개체의 위치와 방향. 움직이는 동안 틱마다 보내고, 멈출 때 한 번 더 보낸다.
message Move {
  sint32 x = 1;
  sint32 z = 2;
  uint32 yaw = 3;
  // 마지막으로 받은 PositionReset의 ack(받은 적이 없으면 0). 서버는 자기 값과 다른 Move를 버린다.
  uint32 ack = 4;
}

// 서버 → 클라이언트. 서버가 Move를 거절하고 내 개체를 되돌린 위치. 클라이언트는 이 위치로 옮기고 다음 Move부터 이 ack를 싣는다.
message PositionReset {
  sint32 x = 1;
  sint32 z = 2;
  // 되돌릴 때마다 1씩 오른다.
  uint32 ack = 3;
}

// 서버 → 클라이언트. 시야에 들어온 개체들. 로그인 직후에는 내 개체도 들어 있다.
message EntitiesEnter {
  repeated EntityEnter entities = 1;
}

// 시야에 들어온 개체 하나.
// 종류마다 싣는 필드가 다르고, 그 종류가 쓰지 않는 필드는 기본값이라 와이어에 실리지 않는다. 값을 채우는 것은 그 기능의 항목이고
// 그 전에는 기본값이 간다(체력 22, 효과와 진행 중인 일 26, 죽었는지 25, 레벨 31, 입은 무기 34, 이름 색 44, 바닥 아이템 33,
// 움직이는 중 54. 그때까지 이동은 매 틱의 EntityMoves로 알린다).
message EntityEnter {
  // 모두: 개체 번호, 종류, 위치와 방향. 번호는 서버가 정하고, 개체가 사라질 때까지 바뀌지 않는다.
  uint32 id = 1;
  sint32 x = 2;
  sint32 z = 3;
  uint32 yaw = 4;
  EntityKind kind = 7;

  // 플레이어: 머리 위에 보일 이름(캐릭터 이름), 직업, 레벨, 이름 색, 입은 무기(Items의 번호. 없으면 0).
  string name = 5;
  CharacterClass character_class = 6;
  uint32 level = 8;
  NameColor name_color = 9;
  uint32 weapon_item_id = 10;

  // 몬스터, NPC, 채집물: 템플릿 번호(Monsters, Npcs, GatherNodes의 줄).
  uint32 template_id = 11;

  // 플레이어와 몬스터: 체력과 최대 체력, 걸린 효과, 진행 중인 일, 죽었는지.
  uint32 hp = 12;
  uint32 max_hp = 13;
  repeated EffectState effects = 14;
  ProgressState progress = 15;
  bool dead = 16;

  // 움직이는 중(플레이어, 몬스터, 움직이는 경비병). 속도는 좌표 단위의 초당 값이고 0이면 서 있다. 플레이어는 가는 방향을,
  // 몬스터와 경비병은 다음 꺾이는 점을 싣는다.
  uint32 speed = 17;
  uint32 move_yaw = 18;
  sint32 next_x = 19;
  sint32 next_z = 20;

  // 바닥 아이템: 아이템 번호, 수량, 강화 수치, 주인(플레이어 번호나 파티 번호. 주인이 없으면 비움), 주인만 줍는 시간이 끝나는 틱,
  // 플레이어가 떨어뜨렸는지.
  uint32 item_id = 21;
  uint32 count = 22;
  uint32 enchant = 23;
  oneof owner {
    uint32 owner_player_id = 24;
    uint32 owner_party_id = 25;
  }
  uint32 owner_only_end_tick = 26;
  bool dropped_by_player = 27;
}

// 개체의 종류. 필드 위의 것은 모두 같은 개체 번호 공간과 시야를 쓴다. 소환수는 backlog 95가 더한다.
enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_PLAYER = 1;
  ENTITY_KIND_MONSTER = 2;
  ENTITY_KIND_NPC = 3;
  ENTITY_KIND_GATHER_NODE = 4;
  ENTITY_KIND_GROUND_ITEM = 5;
}

// 플레이어의 이름 색(성향과 선공 표시. backlog 44).
enum NameColor {
  NAME_COLOR_NORMAL = 0;
  // 선공 표시가 남아 있다.
  NAME_COLOR_AGGRESSOR = 1;
  // 성향이 0보다 낮다.
  NAME_COLOR_OUTLAW = 2;
}

// 개체에 걸린 효과 하나(Effects의 줄과 끝나는 틱. backlog 26).
message EffectState {
  uint32 effect_id = 1;
  uint32 end_tick = 2;
}

// 진행 중인 일. 같은 세 필드를 진행 패킷(Progress, backlog 26)도 쓴다. 진행 중인 일이 없으면 kind가 NONE이다.
message ProgressState {
  ProgressKind kind = 1;
  // 그 일의 번호(시전이면 Skills, 채집이면 GatherNodes, 제작이면 Recipes의 줄, 귀환이면 쓴 아이템의 Items 번호).
  uint32 id = 2;
  uint32 end_tick = 3;
}

enum ProgressKind {
  PROGRESS_KIND_NONE = 0;
  PROGRESS_KIND_CAST = 1;
  PROGRESS_KIND_GATHER = 2;
  PROGRESS_KIND_CRAFT = 3;
  PROGRESS_KIND_RECALL = 4;
}

// 서버 → 클라이언트. 보이는 동안 바뀐 표시 상태(이름 색, 입은 무기, 레벨). 그 개체를 받은 연결과 본인에게 가고, 하나만 바뀌어도
// 셋을 모두 싣는다. 죽음과 부활은 전투의 사건이, 효과와 진행 중인 일은 그 패킷이 알린다. 나와 있는 펫은 backlog 96이 더한다.
message EntityState {
  uint32 id = 1;
  NameColor name_color = 2;
  uint32 weapon_item_id = 3;
  uint32 level = 4;
}

// 서버 → 클라이언트. 시야에서 나간 개체들의 번호.
message EntitiesLeave {
  repeated uint32 ids = 1;
}

// 서버 → 클라이언트. 이번 틱에 움직인 개체들. 내 개체와 움직이지 않은 개체는 넣지 않는다.
message EntityMoves {
  // 서버 틱 번호(20Hz). 클라이언트는 TCP가 몰아서 전해도 이 간격으로 보간한다.
  uint32 tick = 1;
  repeated EntityMove entities = 2;
}

// 이번 틱에 움직인 개체 하나.
message EntityMove {
  uint32 id = 1;
  sint32 x = 2;
  sint32 z = 3;
  uint32 yaw = 4;
  // 걸어온 것이 아니라 옮겨졌다(길이 없어 놓인 점으로 돌아간 몬스터, 부활, 귀환 등). 클라이언트는 보간하지 않고 그 자리에 바로 놓는다.
  bool teleport = 5;
}

// 서버 → 클라이언트. 내 체력, 마나, 전투 상태와 선공 표시가 끝나는 틱(그 틱부터 아님). 하나라도 바뀐 틱에 본인에게만 가고,
// 월드에 들어올 때 EnterWorldResult 뒤에 한 번 간다. 선공 표시는 backlog 44가 채운다.
message SelfVitals {
  uint32 hp = 1;
  uint32 mp = 2;
  uint32 combat_end_tick = 3;
  uint32 aggressor_end_tick = 4;
}

// 서버 → 클라이언트. 피해가 아닌 까닭(회복, 물약, 회복 스킬)으로 체력이나 최대 체력이 바뀐 개체들. 1초마다 그 개체를 받은 연결에
// 모아 보낸다. 피해는 전투의 피해 사건이 남은 체력과 함께 알린다.
message EntityVitals {
  repeated EntityVital entities = 1;
}

message EntityVital {
  uint32 id = 1;
  uint32 hp = 2;
  uint32 max_hp = 3;
}

// 서버 → 클라이언트. 내 능력치. 다시 구한 뒤(레벨, 장비, 강화, 효과가 바뀜)와 월드에 들어올 때 본인에게만 간다.
message SelfStats {
  uint32 max_hp = 1;
  uint32 max_mp = 2;
  uint32 attack = 3;
  uint32 defense = 4;
}

// 서버 → 클라이언트. 경험치가 바뀌었다(본인에게만). 몬스터의 경험치를 받을 때와, 월드에 들어올 때 얻은 양 0으로 한 번(EnterWorldResult 뒤) 간다.
// 오른 레벨은 EntityState가 알린다.
message ExpGained {
  // 얻은 양. 사망 페널티(45)가 잃은 양을 음수로 싣는다.
  sint32 amount = 1;
  // 지금 레벨에서 쌓은 경험치(받은 뒤의 값).
  uint32 exp = 2;
}

// 아이템이 있는 곳. 장비 칸(34), 창고(75)는 그 항목이 더한다.
enum ItemPlace {
  ITEM_PLACE_INVENTORY = 0;
}

// 칸 하나. item_id가 0이면 빈 칸이다(InventoryChanged에서 칸이 비었음을 알림).
message ItemSlot {
  ItemPlace place = 1;
  uint32 index = 2;
  uint32 item_id = 3;
  uint32 count = 4;
  // 강화 수치(장비. 35).
  uint32 enchant = 5;
}

// 서버 → 본인. 월드에 들어올 때(EnterWorldResult 뒤) 인벤토리 전체: 빈 칸이 아닌 칸들과 골드.
message Inventory {
  repeated ItemSlot slots = 1;
  uint64 gold = 2;
}

// 얻은 까닭. 줍기(33), 구매(37), 채집(47), 제작(48), 퀘스트 보상(50)은 그 항목이 더한다.
enum GainReason {
  GAIN_REASON_UNSPECIFIED = 0;
  GAIN_REASON_DEV_COMMAND = 1;
}

message ItemAmount {
  uint32 item_id = 1;
  uint32 count = 2;
}

// 새로 얻은 것 하나: 까닭과, 아이템이나 골드.
message Gain {
  GainReason reason = 1;
  oneof what {
    ItemAmount item = 2;
    uint64 gold = 3;
  }
}

// 서버 → 본인. 이 틱에 바뀐 칸들, 지금 골드, 새로 얻은 것. 옮기거나 바꾼 것(벗기, 창고에서 찾기, 상점에 판 값)은 gains에 싣지 않는다.
message InventoryChanged {
  repeated ItemSlot slots = 1;
  uint64 gold = 2;
  repeated Gain gains = 3;
}

// 클라이언트 → 서버. 인벤토리 칸의 아이템을 쓴다. 답은 RequestResult(같은 요청 번호)다.
message UseItem {
  uint32 slot = 1;
  uint32 request_id = 2;
}

// 서버 → 본인. 요청 번호가 있는 요청(인벤토리를 바꾸는 요청)의 답. result가 NONE이면 성공이고, 바뀐 내용은 InventoryChanged 같은 다른 패킷이 싣는다.
message RequestResult {
  uint32 request_id = 1;
  FailReason result = 2;
}

// 서버 → 클라이언트. 요청 번호가 없는 요청이 실패했다(어느 요청인지와 이유). 끊지 않는다.
message ActionFailed {
  FailReason reason = 1;
  RequestKind request = 2;
}

// 실패한 이유. 0은 성공이다. 값마다의 글은 클라이언트의 문자열 표가 가진다(backlog 28). 뒤의 항목이 자기 이유를 더한다.
enum FailReason {
  FAIL_REASON_NONE = 0;
  // 대상이 없음(없는 번호, 죽었음, 그 연결이 받지 않은 개체).
  FAIL_REASON_NO_TARGET = 1;
  // 공격할 수 없는 대상(CanAttack이 거짓, 복귀 중인 몬스터).
  FAIL_REASON_INVALID_TARGET = 2;
  // 죽은 동안에는 할 수 없는 요청.
  FAIL_REASON_DEAD = 3;
  // 살아 있는데 부활을 요청했다.
  FAIL_REASON_NOT_DEAD = 4;
  // 배우지 않은 스킬(다른 직업의 스킬 포함).
  FAIL_REASON_NOT_LEARNED = 5;
  // 쿨다운이 끝나지 않았다.
  FAIL_REASON_COOLDOWN = 6;
  // 마나가 모자란다.
  FAIL_REASON_NOT_ENOUGH_MP = 7;
  // 대상이 사거리 밖이다.
  FAIL_REASON_OUT_OF_RANGE = 8;
  // 사거리 안이지만 대상까지의 선이 막혔다.
  FAIL_REASON_BLOCKED = 9;
  // 진행 중인 일(시전, 채집, 제작, 귀환)이 있다.
  FAIL_REASON_BUSY = 10;
  // 기절한 동안에는 할 수 없다.
  FAIL_REASON_STUNNED = 11;
  // 진행 중인 일이 중간에 취소됐다(ProgressCancelled만 싣는다).
  FAIL_REASON_CANCELLED = 12;
  // 쓸 수 없는 명령(--dev가 아닌 서버의 DevCommand, 모르는 명령, 값이 맞지 않는 명령).
  FAIL_REASON_INVALID_COMMAND = 13;
  // 넣을 자리가 없다(겹치는 아이템은 같은 아이템이 든 칸이나 빈 칸, 겹치지 않는 아이템은 빈 칸. 32).
  FAIL_REASON_INVENTORY_FULL = 14;
  // 그 칸에 아이템이 없다, 또는 진행 중인 일이 끝날 때 그 아이템을 더 가지지 않았다(32).
  FAIL_REASON_NO_ITEM = 15;
  // 쓰는 종류가 없는 아이템(장비, 재료)이나 아직 쓸 수 없는 아이템(32).
  FAIL_REASON_UNUSABLE_ITEM = 16;
  // 전투 상태에서는 할 수 없다(귀환 주문서. 32).
  FAIL_REASON_IN_COMBAT = 17;
  // 요청을 너무 자주 보내 빈도 제한이 버렸다(요청 번호가 있는 요청에만 RequestResult로 답한다. 28, 32).
  FAIL_REASON_TOO_FAST = 18;
}

// ActionFailed가 어느 요청의 실패인지. 스킬, 채집, 퀵슬롯, 창고, 펫, 부활, 파티, 채팅은 그 요청을 만드는 항목이 더한다.
enum RequestKind {
  REQUEST_KIND_UNSPECIFIED = 0;
  REQUEST_KIND_ATTACK = 1;
  REQUEST_KIND_REVIVE = 2;
  REQUEST_KIND_SKILL = 3;
  // 채팅창에서 보낸 것(개발 명령 68. 채팅 41도 이 값을 쓴다).
  REQUEST_KIND_CHAT = 4;
}

// 클라이언트 → 서버. 대상을 기본 공격한다. 이미 공격 중이면 대상만 바꾼다. 다가가는 것은 클라이언트의 이동이다.
message AttackStart {
  uint32 target_id = 1;
}

// 클라이언트 → 서버. 기본 공격을 멈춘다. 이미 시작한 타격은 맞는다.
message AttackStop {}

// 서버 → 클라이언트. 공격 동작의 시작(그 틱). 결과는 타격까지의 시간 뒤의 Damaged가 알린다. 대상을 받은 연결과 대상 자신에게 가고,
// 받는 연결이 받지 않은 공격자의 번호는 0이다.
message AttackSwing {
  uint32 attacker_id = 1;
  uint32 target_id = 2;
}

// 서버 → 클라이언트. 피해. hp는 맞은 뒤의 체력이다. 받는 연결과 공격자 번호 0의 규칙은 AttackSwing과 같다.
message Damaged {
  uint32 attacker_id = 1;
  uint32 target_id = 2;
  uint32 damage = 3;
  uint32 hp = 4;
  bool critical = 5;
}

// 서버 → 클라이언트. 죽음. 죽은 개체를 받은 연결과 본인에게 가고, 받는 연결이 받지 않은 죽인 개체의 번호는 0이다.
message Died {
  uint32 id = 1;
  uint32 killer_id = 2;
}

// 클라이언트 → 서버. 죽은 내 캐릭터를 마을의 부활 지점에서 일으킨다. 살아 있으면 ActionFailed(NOT_DEAD).
message Revive {}

// 서버 → 클라이언트. 부활(체력과 최대 체력). 그 개체를 받은 연결과 본인에게 간다. 자리는 보는 쪽에는 순간 이동 표시가 있는 움직임,
// 본인에게는 PositionReset이 알린다.
message Revived {
  uint32 id = 1;
  uint32 hp = 2;
  uint32 max_hp = 3;
}

// 클라이언트 → 서버. 스킬을 쓴다. target_id는 대상(0이면 대상 없음). 중심이 자기인 스킬과 자기에게 쓰는 회복·강화는 대상을 보지 않는다.
// force_attack은 강제 공격 표시이고 값을 보는 규칙은 44가 넣는다. 방향은 싣지 않는다. 직선 발사체의 스킬은 대상, 사거리, 선을 보지 않고
// 나가는 틱에 대상(없거나 죽었으면 캐릭터가 보는 쪽)으로 방향을 정한다.
message UseSkill {
  uint32 skill_id = 1;
  uint32 target_id = 2;
  bool force_attack = 3;
}

// 서버 → 클라이언트. 스킬 동작의 시작(시전 시간이 있으면 발동). 결과는 타격까지의 시간 뒤에 따로 온다. 받는 연결과 번호 0의 규칙은 AttackSwing과 같고,
// 대상이 없거나 자기에게 쓴 스킬은 target_id가 시전자다. 직선 발사체의 스킬은 쏜 쪽을 받은 연결과 쏜 쪽 자신에게 가고, 실린 대상의 번호를
// 받지 않은 개체여도 0으로 바꾸지 않는다(대상은 방향만 정하고 서버가 확인하지 않음).
message SkillUsed {
  uint32 caster_id = 1;
  uint32 skill_id = 2;
  uint32 target_id = 3;
}

// 서버 → 클라이언트. 진행 중인 일의 시작. id는 종류에 따른 테이블의 번호(시전은 Skills, 채집은 GatherNodes, 제작은 Recipes, 귀환은 Items)다.
// 그 개체를 받은 연결과 본인에게 간다. 끝은 따로 알리지 않는다(end_tick이 지나면 끝남).
message Progress {
  uint32 id = 1;
  ProgressState state = 2;
}

// 서버 → 클라이언트. 진행 중인 일이 끝나지 못했다. reason은 중간에 취소되면 CANCELLED, 끝나는 틱의 확인에서 걸리면 요청 때와 같은 이유다.
message ProgressCancelled {
  uint32 id = 1;
  FailReason reason = 2;
}

// 서버 → 클라이언트. 효과가 붙었다(같은 효과는 끝나는 틱만 새로 됨). 그 개체를 받은 연결과 본인에게 간다. 떨어지는 것은 알리지 않는다.
message EffectApplied {
  uint32 id = 1;
  EffectState effect = 2;
}

// 서버 → 본인. 스킬마다 쿨다운이 끝나는 틱. 월드에 들어올 때(EnterWorldResult 뒤) 전체를, 그 뒤에는 바뀐 것만 보낸다.
message Cooldowns {
  repeated Cooldown entries = 1;
}

message Cooldown {
  // 스킬의 번호. 물약의 쿨다운이면 0이다.
  uint32 skill_id = 1;
  uint32 end_tick = 2;
  // 물약의 쿨다운이면 Items의 쓰는 종류(ItemUse의 값: 1 체력 회복, 2 마나 회복)이고 스킬이면 0이다. 단계가 다른 물약도 같은 쿨다운에 걸린다(32).
  uint32 potion = 3;
}

// 서버 → 클라이언트. 서버가 옮기는 직선 발사체가 나갔다(그 틱). 나간 자리(x, z)에서 yaw 쪽으로 speed(좌표 단위의 초당 값)로 날아가므로
// 클라이언트는 "나간 자리 + 방향 × 속도 × (서버 틱 − tick) ÷ 초당 틱 수"에 그린다. 방향은 서버가 발사체를 옮기는 값과 같다.
// 쏜 쪽을 받은 연결과 쏜 쪽 자신에게 간다. id는 서버가 매긴 발사체의 번호이고 개체 번호와는 다른 공간이다.
message ProjectileLaunched {
  uint32 id = 1;
  uint32 caster_id = 2;
  sint32 x = 3;
  sint32 z = 4;
  uint32 tick = 5;
  uint32 yaw = 6;
  uint32 speed = 7;
}

// 서버 → 클라이언트. 직선 발사체의 끝(맞음, 벽, 사거리, 쏜 쪽이 죽거나 기절함). 받는 연결은 ProjectileLaunched와 같고, 쏜 쪽이 월드에서
// 빠져 끝난 것은 보내지 않는다(받은 쪽은 쏜 쪽의 EntitiesLeave로 지움). 맞은 결과는 Damaged와 EffectApplied가 따로 알린다.
message ProjectileEnded {
  uint32 id = 1;
}
