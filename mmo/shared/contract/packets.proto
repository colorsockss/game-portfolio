// MMO의 모든 패킷. 서버(C#), Unity(C#), Unreal(C++)이 이 파일에서 protoc로 생성한 코드를 쓴다.
// 프레임은 protobuf의 길이 구분 형식(varint 길이 + Packet)이다. 배포된 필드 번호와 enum 값은 바꾸거나 다시 쓰지 않는다.
syntax = "proto3";

package portfolio.mmo;

option csharp_namespace = "PortfolioMmo.Contract";

// 주고받는 패킷 하나. body의 필드 번호가 패킷 번호이고, 기능마다 범위 하나를 쓴다.
message Packet {
  oneof body {
    // 1–99: 세션(로그인과 연결 끊기)
    Login login = 1;
    LoginResult login_result = 2;
    Kicked kicked = 3;
    Ping ping = 4;
    Pong pong = 5;

    // 100–199: 월드(이동과 시야)
    Move move = 100;
    PositionReset position_reset = 101;
    EntitiesEnter entities_enter = 102;
    EntitiesLeave entities_leave = 103;
    EntityMoves entity_moves = 104;
  }
}

// 프로토콜 버전. 옛 클라이언트를 받을 수 없게 패킷의 뜻이 바뀌면 CURRENT를 올린다.
// 필드를 더하기만 하면 protobuf가 모르는 필드를 건너뛰므로 올리지 않는다.
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_CURRENT = 1;
}

// 좌표와 방향. 지면 좌표 x, z는 1 m를 CONSTANT_UNITS_PER_METER칸으로 나눈 정수(sint32)이고 맵은 ±CONSTANT_MAP_HALF_EXTENT_METERS 안이다.
// 위에서 볼 때 +z가 앞(북), +x가 오른쪽(동)이다. 방향 yaw는 한 바퀴(360°)를 CONSTANT_YAW_STEPS칸으로 나눈 칸 번호이고,
// 0이 +z를 보며 위에서 볼 때 시계 방향으로 는다(64가 +x). 높이는 보내지 않고 각자 지면에서 구한다.
// Unity는 x, z와 Y축 회전에 그대로 쓰고, Unreal은 z를 X(앞), x를 Y(오른쪽)에 쓰며 yaw는 같은 방향이다.

// 서버와 두 클라이언트가 함께 쓰는 수. Protobuf에는 상수가 없어서 enum 값으로 두고, C#과 C++이 여기서 생성된다.
enum Constant {
  CONSTANT_UNSPECIFIED = 0;
  // 1 m를 나눈 좌표 칸 수.
  CONSTANT_UNITS_PER_METER = 32;
  // 맵의 반 너비(m). x, z는 이 거리 안이다.
  CONSTANT_MAP_HALF_EXTENT_METERS = 1024;
  // 한 바퀴를 나눈 yaw 칸 수. yaw는 이보다 작다.
  CONSTANT_YAW_STEPS = 256;
  // 서버의 초당 틱 수. EntityMoves.tick이 틱마다 1씩 오른다.
  CONSTANT_TICKS_PER_SECOND = 20;
  // 최대 이동 속도(m/s). 데이터(backlog 4)가 생기면 데이터로 옮긴다.
  CONSTANT_MAX_SPEED_METERS_PER_SECOND = 6;
  // 클라이언트가 Ping을 보내는 간격(초).
  CONSTANT_PING_INTERVAL_SECONDS = 5;
  // 이 시간(초) 동안 아무것도 받지 못하면 서버도 클라이언트도 연결이 죽었다고 보고 끊는다.
  CONSTANT_IDLE_TIMEOUT_SECONDS = 15;
}

// ── 세션 ──

// 클라이언트 → 서버. 연결한 뒤 처음 보낸다. 서버는 LoginResult로 답한다.
message Login {
  // 클라이언트의 PROTOCOL_VERSION_CURRENT. 서버와 다르면 VERSION_MISMATCH.
  ProtocolVersion protocol_version = 1;
  // 로그인 ID이자 머리 위에 보일 이름. 영문 소문자, 숫자, 밑줄 4–16자이고 형식은 서버가 검사한다.
  string login_id = 2;
}

// 서버 → 클라이언트. Login의 답.
message LoginResult {
  LoginResultCode result = 1;
  // 내 개체 번호. 실패면 0.
  uint32 self_id = 2;
  // 서버의 지금 틱 번호(EntityMoves.tick과 같은 수). 클라이언트가 서버 시계를 맞춘다.
  uint32 tick = 3;
}

// 로그인의 결과.
enum LoginResultCode {
  // 로그인했다. 이어서 내 개체와 주변 개체가 EntitiesEnter로 온다.
  LOGIN_RESULT_CODE_OK = 0;
  // 로그인 ID의 형식이 맞지 않는다.
  LOGIN_RESULT_CODE_INVALID_LOGIN_ID = 1;
  // 클라이언트와 서버의 프로토콜 버전이 다르다. 클라이언트를 업데이트해야 한다.
  LOGIN_RESULT_CODE_VERSION_MISMATCH = 2;
  // 동시 접속이 가득 찼다.
  LOGIN_RESULT_CODE_SERVER_FULL = 3;
}

// 서버 → 클라이언트. 연결을 끊기 바로 전에 보낸다.
message Kicked {
  KickReason reason = 1;
}

// 서버가 연결을 끊는 까닭.
enum KickReason {
  KICK_REASON_UNSPECIFIED = 0;
  // 같은 ID가 다른 연결에서 로그인했다. 예전 연결을 끊는다.
  KICK_REASON_DUPLICATE_LOGIN = 1;
  // 서버가 내려간다.
  KICK_REASON_SERVER_SHUTDOWN = 2;
  // 읽을 수 없는 패킷을 보냈다.
  KICK_REASON_MALFORMED_PACKET = 3;
  // CONSTANT_IDLE_TIMEOUT_SECONDS 동안 아무것도 보내지 않았다.
  KICK_REASON_IDLE_TIMEOUT = 4;
}

// 클라이언트 → 서버. 연결이 살아 있음을 알린다. 로그인 전에도 보낼 수 있고, CONSTANT_PING_INTERVAL_SECONDS마다 보낸다.
message Ping {}

// 서버 → 클라이언트. Ping의 답. 움직이는 개체가 없어도 클라이언트가 서버가 살아 있음과 서버의 틱을 안다.
message Pong {
  // 서버의 지금 틱 번호(EntityMoves.tick과 같은 수).
  uint32 tick = 1;
}

// ── 월드 ──

// 클라이언트 → 서버. 내 개체의 위치와 방향. 움직이는 동안 틱마다 보내고, 멈출 때 한 번 더 보낸다.
message Move {
  sint32 x = 1;
  sint32 z = 2;
  uint32 yaw = 3;
  // 마지막으로 받은 PositionReset의 ack(받은 적이 없으면 0). 서버는 자기 값과 다른 Move를 버린다.
  uint32 ack = 4;
}

// 서버 → 클라이언트. 서버가 Move를 거절하고 내 개체를 되돌린 위치. 클라이언트는 이 위치로 옮기고 다음 Move부터 이 ack를 싣는다.
message PositionReset {
  sint32 x = 1;
  sint32 z = 2;
  // 되돌릴 때마다 1씩 오른다.
  uint32 ack = 3;
}

// 서버 → 클라이언트. 시야에 들어온 개체들. 로그인 직후에는 내 개체도 들어 있다.
message EntitiesEnter {
  repeated EntityEnter entities = 1;
}

// 시야에 들어온 개체 하나.
message EntityEnter {
  // 개체 번호. 서버가 정하고, 개체가 사라질 때까지 바뀌지 않는다.
  uint32 id = 1;
  sint32 x = 2;
  sint32 z = 3;
  uint32 yaw = 4;
  // 머리 위에 보일 이름(로그인 ID).
  string name = 5;
}

// 서버 → 클라이언트. 시야에서 나간 개체들의 번호.
message EntitiesLeave {
  repeated uint32 ids = 1;
}

// 서버 → 클라이언트. 이번 틱에 움직인 개체들. 내 개체와 움직이지 않은 개체는 넣지 않는다.
message EntityMoves {
  // 서버 틱 번호(20Hz). 클라이언트는 TCP가 몰아서 전해도 이 간격으로 보간한다.
  uint32 tick = 1;
  repeated EntityMove entities = 2;
}

// 이번 틱에 움직인 개체 하나.
message EntityMove {
  uint32 id = 1;
  sint32 x = 2;
  sint32 z = 3;
  uint32 yaw = 4;
}
