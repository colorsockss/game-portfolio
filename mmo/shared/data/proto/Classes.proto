// 자동 생성된 파일 — 직접 수정하지 마세요. data-tool이 워크북에서 만듭니다.
syntax = "proto3";

package portfolio.mmo.data;

option csharp_namespace = "PortfolioMmo.Data";

message ClassesRow {
  // 직업(packets.proto의 CharacterClass 값: 1 기사, 2 마법사)
  uint32 id = 1;
  // 기본 공격의 사거리(m)
  double attack_range = 2;
  // 기본 공격의 간격(ms)
  uint32 attack_interval_ms = 3;
  // 공격 동작의 시작에서 타격까지의 시간(ms). 동작에서 무기가 닿는 때에 맞춘다(80)
  uint32 hit_delay_ms = 4;
  // 기본 공격 발사체의 속도(m/s). 비우면 발사체 없이 타격한다(기사)
  optional double projectile_speed = 5;
  // 가지고 시작하는 첫 스킬(Skills의 줄)
  uint32 first_skill = 6;
  // 처음 상태의 아이템(Items의 줄). 기본 무기는 34가 더한다
  repeated uint32 start_items = 7;
  // 처음 상태의 아이템마다의 수(startItems와 같은 차례)
  repeated uint32 start_counts = 8;
  // 입힌 채로 주는 기본 무기(Items의 줄. 34)
  uint32 start_weapon = 9;
  // 체험 캐릭터(94)의 레벨. 직업의 스킬은 모두 배운 채이고 퀵슬롯은 36의 규칙대로 채운다
  uint32 demo_level = 10;
  // 체험 캐릭터가 입은 채로 시작하는 장비(Items의 줄. 칸마다 하나)
  repeated uint32 demo_equipment = 11;
  // 체험 캐릭터의 입은 장비의 강화 수치(35)
  uint32 demo_enchant = 12;
  // 체험 캐릭터의 인벤토리 아이템(Items의 줄)
  repeated uint32 demo_items = 13;
  // 체험 캐릭터의 아이템마다의 수(demoItems와 같은 차례)
  repeated uint32 demo_counts = 14;
  // 체험 캐릭터의 골드
  uint32 demo_gold = 15;
  // 체험 캐릭터가 나와 있는 채로 가진 펫(Pets의 줄. 96)
  uint32 demo_pet = 16;
}

message Classes {
  repeated ClassesRow rows = 1;
}
