// 자동 생성된 파일 — 직접 수정하지 마세요. data-tool이 워크북에서 만듭니다.
syntax = "proto3";

package portfolio.mmo.data;

option csharp_namespace = "PortfolioMmo.Data";

import "Enums.proto";

message SkillsRow {
  // 스킬의 번호(직업 × 100 + 차례)
  uint32 id = 1;
  // 이름(Strings의 키)
  string name_key = 2;
  // 직업(Classes의 id)
  uint32 class = 3;
  // 종류
  SkillKind kind = 4;
  // 계수. 피해는 공격력 × 계수의 공식, 회복은 시전자의 공격력 × 계수. 강화와 상태 이상만 건 스킬은 0
  double coefficient = 5;
  // 사거리(m). 중심이 자기인 스킬과 자기에게 쓰는 회복·강화는 보지 않는다
  double range = 6;
  // 범위(m). 범위 피해만 둔다
  optional double radius = 7;
  // 중심. 대상에게 쓰는 스킬은 대상, 그 자리에서 쓰는 스킬(자기 중심 범위, 회복, 강화)은 자기
  SkillCenter center = 8;
  // 쿨다운(ms)
  uint32 cooldown_ms = 9;
  // 시전 시간(ms). 0이면 시전 없이 바로 쓴다
  uint32 cast_ms = 10;
  // SkillUsed에서 결과까지의 시간(ms). 시전 시간이 있으면 0
  uint32 hit_delay_ms = 11;
  // 범위 예고 시간(ms). 보스의 범위 공격(43)이 쓴다
  optional uint32 warn_ms = 12;
  // 마나
  uint32 mp = 13;
  // 필요 레벨(36)
  uint32 level = 14;
  // 직선으로 나는 발사체의 속도(m/s). 있으면 대상과 사거리와 선을 미리 보지 않고 서버가 옮기는 발사체로 나간다(83). 1/32 m/s의 배수
  optional double projectile_speed = 15;
  // 거는 효과(Effects의 줄)
  optional uint32 effect = 16;
}

message Skills {
  repeated SkillsRow rows = 1;
}
