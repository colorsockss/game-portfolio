// 자동 생성된 파일 — 직접 수정하지 마세요. data-tool이 워크북에서 만듭니다.
syntax = "proto3";

package portfolio.mmo.data;

option csharp_namespace = "PortfolioMmo.Data";

enum ZoneKind {
  // 구역 없음(어느 사각형에도 들지 않는 칸)
  ZONE_KIND_NONE = 0;
  // 마을
  ZONE_KIND_TOWN = 1;
  // 사냥터
  ZONE_KIND_HUNTING_GROUND = 2;
  // 채집지
  ZONE_KIND_GATHERING_GROUND = 3;
  // 보스 자리
  ZONE_KIND_BOSS_AREA = 4;
}

enum MonsterKind {
  // 정하지 않음(proto3 enum의 0. 쓰지 않음)
  MONSTER_KIND_UNSPECIFIED = 0;
  // 일반 몬스터
  MONSTER_KIND_NORMAL = 1;
  // 필드 보스(43)
  MONSTER_KIND_BOSS = 2;
}

enum SkillKind {
  // 정하지 않음(proto3 enum의 0. 쓰지 않음)
  SKILL_KIND_UNSPECIFIED = 0;
  // 단일 피해
  SKILL_KIND_SINGLE_DAMAGE = 1;
  // 범위 피해
  SKILL_KIND_AREA_DAMAGE = 2;
  // 강화
  SKILL_KIND_BUFF = 3;
  // 상태 이상
  SKILL_KIND_DEBUFF = 4;
  // 회복
  SKILL_KIND_HEAL = 5;
}

enum SkillCenter {
  // 정하지 않음(proto3 enum의 0. 쓰지 않음)
  SKILL_CENTER_UNSPECIFIED = 0;
  // 대상
  SKILL_CENTER_TARGET = 1;
  // 자기
  SKILL_CENTER_SELF = 2;
}

enum EffectKind {
  // 정하지 않음(proto3 enum의 0. 쓰지 않음)
  EFFECT_KIND_UNSPECIFIED = 0;
  // 기절(아무 행동도 할 수 없음)
  EFFECT_KIND_STUN = 1;
  // 감속(이동 속도를 값의 %만큼 줄임)
  EFFECT_KIND_SLOW = 2;
  // 공격력 올림
  EFFECT_KIND_ATTACK_UP = 3;
  // 방어력 올림
  EFFECT_KIND_DEFENSE_UP = 4;
}

enum ItemKind {
  // 정하지 않음(proto3 enum의 0. 쓰지 않음)
  ITEM_KIND_UNSPECIFIED = 0;
  // 장비(겹치지 않고 강화 수치를 가짐. 34)
  ITEM_KIND_EQUIPMENT = 1;
  // 소모품(물약, 주문서, 스킬북, 펫 아이템)
  ITEM_KIND_CONSUMABLE = 2;
  // 재료(채집물, 몬스터 부산물)
  ITEM_KIND_MATERIAL = 3;
  // 골드(바닥에 떨어질 때만 아이템. 33)
  ITEM_KIND_GOLD = 4;
}

enum ItemGrade {
  // 정하지 않음(proto3 enum의 0. 쓰지 않음)
  ITEM_GRADE_UNSPECIFIED = 0;
  // 일반
  ITEM_GRADE_COMMON = 1;
  // 고급
  ITEM_GRADE_UNCOMMON = 2;
  // 희귀
  ITEM_GRADE_RARE = 3;
  // 영웅
  ITEM_GRADE_EPIC = 4;
}

enum EquipSlot {
  // 정하지 않음(proto3 enum의 0. 쓰지 않음)
  EQUIP_SLOT_UNSPECIFIED = 0;
  // 무기
  EQUIP_SLOT_WEAPON = 1;
  // 투구
  EQUIP_SLOT_HELMET = 2;
  // 갑옷
  EQUIP_SLOT_ARMOR = 3;
  // 장갑
  EQUIP_SLOT_GLOVES = 4;
  // 신발
  EQUIP_SLOT_BOOTS = 5;
  // 장신구
  EQUIP_SLOT_ACCESSORY = 6;
}

enum ItemUse {
  // 쓰지 않음(장비, 재료, 골드)
  ITEM_USE_NONE = 0;
  // 체력 회복(값만큼)
  ITEM_USE_HEAL_HP = 1;
  // 마나 회복(값만큼)
  ITEM_USE_HEAL_MP = 2;
  // 귀환(쓰는 시간 뒤 마을의 부활 지점)
  ITEM_USE_RECALL = 3;
  // 스킬 배우기(값은 Skills의 줄. 36)
  ITEM_USE_LEARN_SKILL = 4;
  // 강화(UseItem이 아니라 강화 요청으로 씀. 35)
  ITEM_USE_ENCHANT = 5;
  // 펫 얻기(값은 Pets의 줄. 96)
  ITEM_USE_GET_PET = 6;
}

enum NpcRole {
  // 정하지 않음(proto3 enum의 0. 쓰지 않음)
  NPC_ROLE_UNSPECIFIED = 0;
  // 상점(37)
  NPC_ROLE_SHOP = 1;
  // 창고(75)
  NPC_ROLE_STORAGE = 2;
  // 제작(48)
  NPC_ROLE_CRAFT = 3;
  // 퀘스트(50)
  NPC_ROLE_QUEST = 4;
  // 경비병(44)
  NPC_ROLE_GUARD = 5;
}
