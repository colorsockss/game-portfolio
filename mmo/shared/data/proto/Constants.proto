// 자동 생성된 파일 — 직접 수정하지 마세요. data-tool이 워크북에서 만듭니다.
syntax = "proto3";

package portfolio.mmo.data;

option csharp_namespace = "PortfolioMmo.Data";

message Constants {
  // 필드 한 변의 길이(m). 필드는 -fieldSize/2 이상 fieldSize/2 미만이다
  uint32 field_size = 1;
  // 전투 상태 시간(ms). 공격하거나 피해·상태 이상을 받으면 이만큼 미룬다
  uint32 combat_duration_ms = 2;
  // 전투 상태가 아닐 때 초당 채우는 최대 체력·마나의 비율(%)
  uint32 regen_percent = 3;
  // 전투 상태에서 초당 채우는 최대 체력·마나의 비율(%)
  uint32 combat_regen_percent = 4;
  // 치명타의 확률(0–1)
  double crit_chance = 5;
  // 치명타가 피해에 곱하는 배수
  double crit_multiplier = 6;
  // 플레이어의 반지름(m). 클라이언트의 캡슐(34 cm)과 같은 값
  double player_radius = 7;
  // 몬스터가 길이 없는 대상을 건너뛰는 시간(ms, "닿을 수 없음")
  uint32 unreachable_ms = 8;
  // 몬스터가 길을 다시 찾는 대상의 이동 거리(m). 길을 찾은 때의 대상 자리에서 이만큼 넘게 옮기면 다시 찾는다
  double repath_distance = 9;
  // 복귀의 길찾기 범위에 더하는 거리(m). 범위는 놓인 점에서 지금 거리 + 이것이다
  double return_range_margin = 10;
  // 복귀 중인 몬스터가 초당 채우는 최대 체력의 비율(%)
  uint32 return_regen_percent = 11;
  // 배회에서 한 점에 서 있는 가장 짧은 시간(ms)
  uint32 wander_pause_min_ms = 12;
  // 배회에서 한 점에 서 있는 가장 긴 시간(ms)
  uint32 wander_pause_max_ms = 13;
  // 부활할 때 채우는 최대 체력의 비율(%)
  uint32 revive_hp_percent = 14;
  // 죽은 몬스터가 쓰러진 채 남는 시간(ms). 다시 나오는 시간은 죽은 틱부터 센다
  uint32 dead_monster_ms = 15;
  // 상호작용을 실행하는 거리(m). 이 안이고 선이 트인 곳에서 줍기·채집·말하기를 한다
  double interact_range = 16;
  // 상호작용 버튼이 고르는 거리(m). 이 안의 가장 가까운 상호작용할 수 있는 것을 고른다
  double interact_pick_range = 17;
  // 연결마다 요청의 빈도를 재는 버킷의 토큰 수. 받은 패킷(Move 포함)마다 하나를 쓰고, 없으면 그 요청을 버린다
  uint32 rate_limit_tokens = 18;
  // 버킷에 초당 채우는 토큰 수(지난 틱 수만큼 채움)
  uint32 rate_limit_refill_per_second = 19;
  // 요청을 버리기 시작한 때부터 버리는 일이 이만큼 이어지면 끊는 시간(ms)
  uint32 rate_limit_kick_ms = 20;
  // 버린 것이 이만큼 없으면 버린 시간을 처음부터 다시 세는 시간(ms)
  uint32 rate_limit_reset_ms = 21;
  // 인벤토리 칸 수
  uint32 inventory_slots = 22;
  // 바닥 아이템이 남는 시간(ms). 플레이어가 떨어뜨린 것도 같다
  uint32 drop_lifetime_ms = 23;
  // 드롭의 주인만 줍는 시간(ms)
  uint32 owner_only_ms = 24;
  // 드롭을 흩는 거리(m). 죽은 자리에서 이 안의 점에 놓는다
  double drop_scatter = 25;
  // 자동 사냥이 대상과 주울 것을 고르는 범위(m). 시작한 자리에서 잰다(40)
  double auto_hunt_range = 27;
  // 자동 사냥이 회복 스킬이나 체력 물약을 쓰는 체력(최대의 %)
  uint32 auto_hunt_hp_percent = 28;
  // 자동 사냥이 마나 물약을 쓰는 마나(최대의 %)
  uint32 auto_hunt_mp_percent = 29;
  // 자동 사냥이 길이 없거나, 공격할 수 없거나, 가까워지지 못한 대상을 후보에서 빼는 시간(ms)
  uint32 auto_hunt_exclude_ms = 30;
  // 자동 사냥이 다가가는 동안 이만큼 대상에 가까워지지 못하면 그 대상을 뺀다(ms. 기다리는 동안은 세지 않음)
  uint32 auto_hunt_stall_ms = 31;
  // 손으로 조작한 뒤 자동 사냥이 멈추는 시간(ms)
  uint32 auto_hunt_manual_pause_ms = 32;
  // 창고 칸 수(75. 캐릭터마다)
  uint32 storage_slots = 33;
  // 채팅 한 줄의 길이(UTF-8 바이트, 한글 60자. 41). Chat의 프레임이 클라이언트 패킷의 상한(256바이트) 안에 들게 하는 값이다
  uint32 chat_max_bytes = 34;
  // 플레이어가 1초 안에 보낼 수 있는 채팅 수(41). 넘으면 "너무 자주 보냄"이다
  uint32 chat_per_second = 35;
  // 파티 경험치 보너스(%, 42). 경험치를 받는 파티원이 한 명 늘 때마다 합에 더한다(2명 +10%, 5명 +40%)
  uint32 party_exp_bonus_percent = 36;
  // 파티 초대가 답을 기다리는 시간(ms, 42). 지나면 초대가 사라진다
  uint32 party_invite_ms = 37;
  // 선공 표시가 남는 시간(ms, 44). 일반 플레이어를 공격하기 시작한 틱부터 세고, 다시 그러면 새로 센다
  uint32 aggressor_ms = 38;
  // PK를 할 수 있는 레벨(44). 이보다 낮은 플레이어는 다른 플레이어를 공격하지도 받지도 않는다
  uint32 pk_min_level = 39;
  // 일반 플레이어를 죽인 플레이어의 성향이 내려가는 값(44). 성향이 0보다 낮으면 무법자다
  uint32 karma_kill_penalty = 40;
  // 몬스터를 잡아 경험치를 받을 때마다 성향이 오르는 값(44). 0을 넘지 않는다
  uint32 karma_monster_gain = 41;
  // 일반과 선공 플레이어가 죽으면 잃는 경험치(지금 레벨에서 쌓은 것의 %. 내림, 45). 레벨은 내려가지 않는다
  uint32 death_exp_percent = 42;
  // 무법자가 죽으면 잃는 경험치(지금 레벨에서 쌓은 것의 %. 45)
  uint32 outlaw_death_exp_percent = 43;
  // 무법자가 죽으면 인벤토리의 차 있는 칸 하나를 통째로 떨어뜨릴 확률(%, 45). 창고는 뽑지 않는다
  uint32 outlaw_drop_inventory_percent = 44;
  // 무법자가 죽으면 입은 장비 가운데 하나를 떨어뜨릴 확률(%, 45). 인벤토리와 따로 굴린다
  uint32 outlaw_drop_equipment_percent = 45;
  // 소환수가 주인을 따라가 서는 거리(m, 95). 대상이 없고 이보다 멀면 주인 쪽으로 걷는다
  double summon_follow_distance = 46;
  // 소환수가 주인에게서 떨어질 수 있는 거리(m, 95). 넘으면 대상을 버리고 주인의 자리로 옮긴다. 길을 찾는 범위도 주인 둘레 이 거리다
  double summon_leash_distance = 47;
  // 나와 있는 펫이 바닥 아이템을 하나 줍는 간격(ms, 96)
  uint32 pet_pick_interval_ms = 48;
  // 시야 경계의 여유(m, 78). 둘레 3×3 시야 칸을 벗어난 개체는 그 바깥 테두리에서 이만큼 넘게 멀어져야 나간다(들어오는 기준은 3×3칸 그대로)
  double view_margin = 49;
}
