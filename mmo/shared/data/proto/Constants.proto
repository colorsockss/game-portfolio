// 자동 생성된 파일 — 직접 수정하지 마세요. data-tool이 워크북에서 만듭니다.
syntax = "proto3";

package portfolio.mmo.data;

option csharp_namespace = "PortfolioMmo.Data";

message Constants {
  // 필드 한 변의 길이(m). 필드는 -fieldSize/2 이상 fieldSize/2 미만이다
  uint32 field_size = 1;
  // 전투 상태 시간(ms). 공격하거나 피해·상태 이상을 받으면 이만큼 미룬다
  uint32 combat_duration_ms = 2;
  // 전투 상태가 아닐 때 초당 채우는 최대 체력·마나의 비율(%)
  uint32 regen_percent = 3;
  // 전투 상태에서 초당 채우는 최대 체력·마나의 비율(%)
  uint32 combat_regen_percent = 4;
  // 치명타의 확률(0–1)
  double crit_chance = 5;
  // 치명타가 피해에 곱하는 배수
  double crit_multiplier = 6;
  // 플레이어의 반지름(m). 클라이언트의 캡슐(34 cm)과 같은 값
  double player_radius = 7;
  // 몬스터가 길이 없는 대상을 건너뛰는 시간(ms, "닿을 수 없음")
  uint32 unreachable_ms = 8;
  // 몬스터가 길을 다시 찾는 대상의 이동 거리(m). 길을 찾은 때의 대상 자리에서 이만큼 넘게 옮기면 다시 찾는다
  double repath_distance = 9;
  // 복귀의 길찾기 범위에 더하는 거리(m). 범위는 놓인 점에서 지금 거리 + 이것이다
  double return_range_margin = 10;
  // 복귀 중인 몬스터가 초당 채우는 최대 체력의 비율(%)
  uint32 return_regen_percent = 11;
  // 배회에서 한 점에 서 있는 가장 짧은 시간(ms)
  uint32 wander_pause_min_ms = 12;
  // 배회에서 한 점에 서 있는 가장 긴 시간(ms)
  uint32 wander_pause_max_ms = 13;
  // 부활할 때 채우는 최대 체력의 비율(%)
  uint32 revive_hp_percent = 14;
  // 죽은 몬스터가 쓰러진 채 남는 시간(ms). 다시 나오는 시간은 죽은 틱부터 센다
  uint32 dead_monster_ms = 15;
  // 상호작용을 실행하는 거리(m). 이 안이고 선이 트인 곳에서 줍기·채집·말하기를 한다
  double interact_range = 16;
  // 상호작용 버튼이 고르는 거리(m). 이 안의 가장 가까운 상호작용할 수 있는 것을 고른다
  double interact_pick_range = 17;
  // 연결마다 요청의 빈도를 재는 버킷의 토큰 수. 받은 패킷(Move 포함)마다 하나를 쓰고, 없으면 그 요청을 버린다
  uint32 rate_limit_tokens = 18;
  // 버킷에 초당 채우는 토큰 수(지난 틱 수만큼 채움)
  uint32 rate_limit_refill_per_second = 19;
  // 요청을 버리기 시작한 때부터 버리는 일이 이만큼 이어지면 끊는 시간(ms)
  uint32 rate_limit_kick_ms = 20;
  // 버린 것이 이만큼 없으면 버린 시간을 처음부터 다시 세는 시간(ms)
  uint32 rate_limit_reset_ms = 21;
  // 인벤토리 칸 수
  uint32 inventory_slots = 22;
}
