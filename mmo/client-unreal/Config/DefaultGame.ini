; 코드가 경로로만 읽는 에셋(직업별 캐릭터, 위젯 블루프린트)은 레벨이 참조하지 않으므로 늘 쿠킹한다.
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/Game/Characters")
+DirectoriesToAlwaysCook=(Path="/Game/UI")
+DirectoriesToAlwaysCook=(Path="/Game/Effects")
; 기획 데이터(Protobuf 바이너리와 해시)는 에셋이 아니라 쿠킹하지 않고 그대로 싣는다. package.mjs가 mmo/shared/data/files/를
; Content/Data/로 복사한 뒤 패키징한다.
+DirectoriesToAlwaysStageAsUFS=(Path="Data")

