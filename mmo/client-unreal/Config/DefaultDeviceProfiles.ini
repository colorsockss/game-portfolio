; 엔진의 Android 기본 프로필은 Vulkan을 끄고(r.Android.DisableVulkanSupport=1) 일부 기기 프로필만 켠다. 이 프로젝트는 Vulkan만
; 싣으므로(DefaultEngine.ini) 모든 기기에서 켠다. 그러지 않으면 목록에 없는 기기(BlueStacks 포함)가 "Unable to run"으로 멈춘다.
; Vulkan 1.1 드라이버가 없는 기기는 엔진의 드라이버 검사에서 그대로 거절된다.
[Android DeviceProfile]
+CVars=r.Android.DisableVulkanSupport=0
