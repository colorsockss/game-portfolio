; 맵은 Field 하나다(Scripts/create_content.py가 만든다). 로그인 화면도 이 레벨에서 띄워 레벨을 옮기지 않는다.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Maps/Field
EditorStartupMap=/Game/Maps/Field
GlobalDefaultGameMode=/Script/PortfolioMmo.MmoGameMode

; arm64 기기만 받는다(MmoProtobuf의 Android 라이브러리가 arm64-v8a뿐이다). 데이터를 APK 하나에 넣어 바로 설치할 수 있게 한다.

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
PackageName=cloud.dennou.mmo
ApplicationDisplayName=PortfolioMmo
MinSDKVersion=26
TargetSDKVersion=36
bBuildForArm64=True
bBuildForX8664=False
bPackageDataInsideApk=True
; Vulkan만 싣는다. BlueStacks에서 OpenGL ES 렌더러가 에뮬레이터 드라이버 안에서 크래시가 났고(2026-11-10), 한 벌이면 셰이더도 준다.
bSupportsVulkan=True
bBuildForES31=False

; Mac 셰이더는 SM5 한 벌만 싣는다. SM6가 필요한 Nanite·Lumen·가상 그림자를 아래에서 끄므로 SM5로 충분하다.
[/Script/MacTargetPlatform.MacTargetSettings]
-TargetedRHIs=SF_METAL_SM6

; 쓰지 않는 렌더러 기능을 꺼 셰이더를 줄인다. 조명은 동적 조명만 쓴다(Lumen·Nanite·가상 그림자·레이 트레이싱·라이트맵 없음).
[/Script/Engine.RendererSettings]
r.Nanite.ProjectEnabled=False
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
r.Shadow.Virtual.Enable=0
r.GenerateMeshDistanceFields=False
r.RayTracing=False
r.Lumen.HardwareRayTracing=False
r.AllowStaticLighting=False
r.SupportStationarySkylight=False
r.SupportLowQualityLightmaps=False
r.SupportPointLightWholeSceneShadows=False
